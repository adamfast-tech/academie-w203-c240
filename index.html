<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="W203">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Académie W203</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cursus complet pour entretenir, diagnostiquer et réparer soi-même une Mercedes C 240 W203 (203.061) à moteur M112.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout : manuel d'atelier numérique — colonne de lecture ~68ch, rail de navigation à gauche sur grand écran, barre d'onglets en bas sur téléphone. Plaque constructeur en alu brossé comme signature. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#E3E8ED; --ink:#13181E; --muted:#56616E; --line:#CBD3DB;
  --accent:#1C5797; --accent-soft:#DCE6F2; --on-accent:#FFFFFF;
  --amber:#8F5400; --amber-soft:#F7E9CF; --red:#A3241A; --red-soft:#F6DDD9; --green:#1F6B45; --green-soft:#DAEEE2;
  --plate-a:#E6EAEE; --plate-b:#C8CFD6; --plate-ink:#28313A; --rivet:#9AA4AE;
  --shadow:0 1px 2px rgba(19,24,30,.06),0 6px 18px rgba(19,24,30,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --nav-h:64px; --head-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1115; --surface:#161A20; --surface-2:#1F252D; --ink:#E3E8EE; --muted:#9BA6B3; --line:#2C343E;
    --accent:#86B6EE; --accent-soft:#1A2A3E; --on-accent:#0E1115;
    --amber:#EAAE55; --amber-soft:#30250F; --red:#F28F84; --red-soft:#3A1D1A; --green:#74D1A0; --green-soft:#132E1F;
    --plate-a:#2A3038; --plate-b:#1B2027; --plate-ink:#CBD3DC; --rivet:#55606B;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1115; --surface:#161A20; --surface-2:#1F252D; --ink:#E3E8EE; --muted:#9BA6B3; --line:#2C343E;
  --accent:#86B6EE; --accent-soft:#1A2A3E; --on-accent:#0E1115;
  --amber:#EAAE55; --amber-soft:#30250F; --red:#F28F84; --red-soft:#3A1D1A; --green:#74D1A0; --green-soft:#132E1F;
  --plate-a:#2A3038; --plate-b:#1B2027; --plate-ink:#CBD3DC; --rivet:#55606B;
  --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--accent);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0;font-weight:600;letter-spacing:.005em}
h1{font-size:clamp(2rem,1.5rem + 2.2vw,2.9rem)}
h2{font-size:1.65rem}
h3{font-size:1.3rem}
h4{font-size:1.1rem}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);height:var(--head-h);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-size:1.45rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.88rem}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.xp-pill{font-family:var(--f-mono);font-size:.78rem;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.layout{display:grid;grid-template-columns:1fr;min-height:calc(100vh - var(--head-h))}
.rail{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{max-width:1040px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:500;letter-spacing:.02em}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--accent)}
.tabbar a.on svg{stroke-width:2.2}

@media (min-width:1000px){
  .layout{grid-template-columns:260px 1fr}
  .rail{display:block;position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--head-h) - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px 30px}
  .tabbar{display:none}
  main{padding-block:32px 60px}
}
.rail-nav{display:grid;gap:2px;margin-bottom:18px}
.rail-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem}
.rail-nav a svg{width:18px;height:18px;color:var(--muted)}
.rail-nav a:hover{background:var(--surface-2)}
.rail-nav a.on{background:var(--accent-soft);color:var(--accent)}
.rail-nav a.on svg{color:var(--accent)}
.rail h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:6px 10px 8px}
.rail-mods{display:grid;gap:1px}
.rail-mods a{display:grid;grid-template-columns:36px 1fr auto;gap:6px;align-items:center;padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-size:.86rem;line-height:1.25}
.rail-mods a:hover{background:var(--surface-2)}
.rail-mods a.on{background:var(--surface-2)}
.rail-mods .c{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.rail-mods .p{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}

/* ---------- Generic blocks ---------- */
.stack{display:grid;gap:20px}
.section{display:grid;gap:14px;margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 11px;font-size:.85rem}
.btn.done{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.03em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.lv0{color:var(--muted)} .chip.lv1{color:var(--accent);border-color:var(--accent)} .chip.lv2{color:var(--green);border-color:var(--green)} .chip.lv3{color:var(--amber);border-color:var(--amber)} .chip.lv4{color:var(--red);border-color:var(--red)}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
textarea.input{min-height:84px;resize:vertical}
label.lbl{display:grid;gap:5px;font-size:.84rem;color:var(--muted);font-weight:500}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}
@media (min-width:1000px){.toast{bottom:24px}}

/* ---------- Plate (signature) ---------- */
.plate{position:relative;border-radius:5px;border:1px solid var(--line);color:var(--plate-ink);padding:22px 24px 20px;
  background-color:var(--plate-a);
  background-image:
    radial-gradient(circle at 12px 12px,var(--rivet) 0 3px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 12px) 12px,var(--rivet) 0 3px,transparent 3.6px),
    radial-gradient(circle at 12px calc(100% - 12px),var(--rivet) 0 3px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),var(--rivet) 0 3px,transparent 3.6px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
    linear-gradient(160deg,var(--plate-a),var(--plate-b));
}
.plate-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--rivet);padding-bottom:8px;margin-bottom:12px}
.plate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:10px 18px;font-family:var(--f-mono)}
.plate-grid div{display:grid;gap:1px;min-width:0}
.plate-grid small{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.plate-grid b{font-weight:500;font-size:.95rem}

/* ---------- Home ---------- */
.hero{display:grid;gap:20px}
.hero h1{font-size:clamp(2.3rem,1.6rem + 3.4vw,3.6rem);text-transform:uppercase;letter-spacing:.01em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.08rem;max-width:62ch;margin:0;color:var(--muted)}
.progress-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface-2)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--f-mono);font-size:17px}
.rank-name{font-family:var(--f-display);font-size:1.6rem;font-weight:700;text-transform:uppercase}
.tool-tile{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tool-tile:hover{border-color:var(--accent)}
.tool-tile svg{width:26px;height:26px;color:var(--accent)}
.tool-tile b{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.tool-tile span{font-size:.88rem;color:var(--muted);line-height:1.4}
.levels{display:grid;gap:8px}
.level-row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.level-row .n{font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--muted)}
.level-row b{display:block;font-weight:600}
.level-row small{color:var(--muted);font-size:.84rem}
.dossier{display:grid;gap:6px}
.dossier .row{justify-content:space-between}
.status{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.status.afaire{background:var(--amber-soft);color:var(--amber)} .status.encours{background:var(--accent-soft);color:var(--accent)} .status.fait{background:var(--green-soft);color:var(--green)}

/* ---------- Cursus ---------- */
.mod-card{display:grid;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mod-card:hover{border-color:var(--accent)}
.mod-card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mod-card .code{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mod-card h3{font-size:1.35rem}
.mod-card p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.45}
.lesson-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.lesson-list a{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:13px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.lesson-list a:first-child{border-top:0}
.lesson-list a:hover{background:var(--surface-2)}
.lesson-list .c{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.lesson-list .t{font-weight:500;line-height:1.35}
.lesson-list .m{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- Lesson ---------- */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.lesson{max-width:760px;margin:0 auto}
.lesson-head{display:grid;gap:10px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.lesson-head .lead{margin:0;font-size:1.1rem;color:var(--muted);max-width:62ch}
.prose{max-width:68ch}
.prose>*+*{margin-top:1em}
.prose h2{font-size:1.5rem;margin-top:1.7em;padding-top:.2em}
.prose h3{font-size:1.22rem;margin-top:1.4em}
.prose p,.prose ul,.prose ol{margin-bottom:0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li+li{margin-top:.35em}
.prose strong{font-weight:600}
.prose code,.kbd{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:3px}
.prose figure{margin:1.4em 0;display:grid;gap:8px}
.prose figure svg{width:100%;height:auto;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.prose figcaption{font-size:.84rem;color:var(--muted)}
ol.steps{list-style:none;padding:0;counter-reset:st;display:grid;gap:10px}
ol.steps>li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;margin:0}
ol.steps>li::before{content:counter(st);font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.callout{border-radius:var(--r);padding:14px 16px;background:var(--surface-2);display:grid;gap:6px}
.callout>p,.callout>ul{margin:0}
.callout ul{padding-left:1.2em}
.callout-label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.callout.danger{background:var(--red-soft)} .callout.danger .callout-label{color:var(--red)}
.callout.warn{background:var(--amber-soft)} .callout.warn .callout-label{color:var(--amber)}
.callout.tip{background:var(--green-soft)} .callout.tip .callout-label{color:var(--green)}
.callout.w203{background:var(--accent-soft)} .callout.w203 .callout-label{color:var(--accent)}
.callout.info .callout-label{color:var(--muted)}
.src{display:inline-block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;vertical-align:.12em;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.s-wis{color:var(--green)} .s-hay{color:var(--accent)} .s-frm{color:var(--amber)} .s-oem{color:var(--muted)} .s-gen{color:var(--muted)} .s-mb{color:var(--green)}
.s-chk{color:var(--red);border-style:dashed}
.nm{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);padding:1px 6px;border-radius:3px;white-space:nowrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.spec{border-collapse:collapse;width:100%;font-size:.92rem}
table.spec th,table.spec td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.spec thead th{border-top:0;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
table.spec td.v{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.keypoints{border-top:2px solid var(--ink);padding-top:14px;margin-top:28px}
.keypoints ul{margin:8px 0 0;padding-left:1.2em}

.quiz{margin-top:36px;display:grid;gap:14px}
.quiz-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.q-text{margin:0;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.q-x{margin:0;font-size:.92rem;color:var(--muted)}
.quiz-result{padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);font-weight:500}
.lesson-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pager a{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager a small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a span{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pager a.next{text-align:right}

/* ---------- Diagnostic ---------- */
.tree-card{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tree-card:hover{border-color:var(--accent)}
.tree-card b{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.tree-card span{color:var(--muted);font-size:.9rem;line-height:1.4}
.trail{display:grid;gap:6px;margin-bottom:6px}
.trail div{font-size:.88rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.trail div b{color:var(--ink);font-weight:500}
.ask{font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.2;margin:0}
.answers{display:grid;gap:8px}
.answers button{text-align:left;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;line-height:1.35}
.answers button:hover{border-color:var(--accent);background:var(--accent-soft)}
.verdict{display:grid;gap:14px}
.sev{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:4px}
.sev.stop{background:var(--red-soft);color:var(--red)} .sev.vite{background:var(--amber-soft);color:var(--amber)} .sev.surv{background:var(--green-soft);color:var(--green)}
.causes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.causes li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.prob{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;margin-top:2px}
.prob.h{background:var(--red-soft);color:var(--red)} .prob.m{background:var(--amber-soft);color:var(--amber)} .prob.b{background:var(--surface-2);color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.88rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--surface)}
.links a:hover{border-color:var(--accent)}

/* ---------- Reference ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:thin}
.tabs a{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.9rem;background:var(--surface)}
.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:640px){.filters{grid-template-columns:2fr 1fr}}
.code-item{display:grid;grid-template-columns:minmax(78px,7.2rem) 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.code-item:first-child{border-top:0}
.code-item .k{font-family:var(--f-mono);font-weight:500;color:var(--accent);overflow-wrap:anywhere}
.code-item p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.code-item .t{font-weight:600}
.list-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tool-row{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.tool-row:first-child{border-top:0}
.tool-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.tool-row b{font-weight:600}
.tool-row p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.gl-item{padding:12px 14px;border-top:1px solid var(--line)}
.gl-item:first-child{border-top:0}
.gl-item b{font-weight:600}
.gl-item i{font-style:normal;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:6px}
.gl-item p{margin:3px 0 0;font-size:.92rem}
.calc{display:grid;gap:12px}
.calc-out{font-family:var(--f-mono);font-size:1.05rem;padding:12px 14px;background:var(--surface-2);border-radius:var(--r);font-variant-numeric:tabular-nums}
.leak{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.leak:first-child{border-top:0}
.swatch{width:40px;height:40px;border-radius:50%;border:1px solid var(--line)}

/* ---------- Garage ---------- */
.log-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.log-item:first-child{border-top:0}
.log-item .meta{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.log-item p{margin:3px 0 0;font-size:.92rem}
.plan-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:0}
@media (min-width:700px){.plan-row{grid-template-columns:1.4fr 130px 150px 1fr;align-items:center}}
.plan-row b{font-weight:600}
.plan-row small{display:block;color:var(--muted);font-size:.8rem}
.due{font-family:var(--f-mono);font-size:.82rem}
.due.late{color:var(--red)} .due.soon{color:var(--amber)} .due.ok{color:var(--green)}

/* ---------- Search ---------- */
.search-panel{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.search-bar{display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.search-bar input{flex:1;min-width:0;font-size:1.05rem;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper)}
.search-results{flex:1;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.search-results .inner{max-width:760px;margin:0 auto;display:grid;gap:18px}
.res-group h4{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.res-group a{display:block;padding:10px 12px;border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);margin-top:6px}
.res-group a small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}

/* ---------- Diagram strokes ---------- */
.dg-l{stroke:var(--ink);fill:none;stroke-width:1.6}
.dg-m{stroke:var(--muted);fill:none;stroke-width:1.2}
.dg-a{stroke:var(--accent);fill:none;stroke-width:2.2}
.dg-r{stroke:var(--red);fill:none;stroke-width:2}
.dg-f{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.4}
.dg-fa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.dg-dot{fill:var(--accent)}
.dg-t{fill:var(--ink);font-family:var(--f-mono);font-size:12px}
.dg-ts{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.dg-tb{fill:var(--ink);font-family:var(--f-display);font-size:16px;font-weight:600}
.dg-ta{fill:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:500}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:560px){.brand span{display:none}.icon-btn .lbl{display:none}.icon-btn{padding:8px}}
@media (max-width:400px){.xp-r{display:none}}
.icon-btn{text-decoration:none;color:var(--ink);position:relative}
.icon-btn .lbl{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.acct-dot.ok{background:var(--green)} .acct-dot.off{background:var(--amber)}
@media (max-width:560px){.icon-btn .acct-dot{position:absolute;top:4px;right:4px}}

<script>
window.W203 = { modules: [], ref: {}, trees: [], garage: {} };
(function () {
  const W = window.W203;
  const LABELS = {
    wis: ['WIS', 'Valeur issue de la documentation atelier Mercedes (WIS)'],
    mb: ['Mercedes', 'Documentation publique Mercedes-Benz (archives, BeVo, notice)'],
    hay: ['Haynes', 'Manuel Haynes (repris par des propriétaires)'],
    oem: ['Fabricant', 'Marquage sur la pièce ou donnée du fabricant de la pièce'],
    frm: ['Terrain', 'Retours d’ateliers et de propriétaires (forums spécialisés)'],

  W.SRC = LABELS;

  const D = {};

      g += `<circle class="dg-l" cx="${x + 60}" cy="200" r="8"/>`;

      g += `<line class="${exOpen ? 'dg-a' : 'dg-l'}" x1="${x + 90}" y1="${exOpen ? 50 : 40}" x2="${x + 90}" y2="22"/><line class="${exOpen ? 'dg-a' : 'dg-l'}" x1="${x + 80}" y1="${exOpen ? 50 : 40}" x2="${x + 100}" y2="${exOpen ? 50 : 40}"/>`;

W.mod({ id: 'meca', num: 2, code: 'M02', level: 1, title: 'Fondamentaux mécaniques',

  lessons: [

    lead: 'Tout ce qui suit repose sur ce cycle. Prends le temps de le visualiser.',
    body: `
${fig(D.fourStroke, 'Les quatre temps. Le vilebrequin fait deux tours pour un cycle complet ; l’arbre à cames en fait un.')}
<ol>
<li><strong>Admission</strong> : le piston descend, la soupape d’admission est ouverte, le cylindre aspire l’air (et l’essence injectée dans la tubulure).</li>
<li><strong>Compression</strong> : soupapes fermées, le piston remonte et comprime le mélange.</li>
<li><strong>Combustion-détente</strong> : les bougies allument le mélange juste avant le point mort haut. La pression repousse le piston : c’est le seul temps moteur.</li>
<li><strong>Échappement</strong> : la soupape d’échappement s’ouvre, le piston remonte et chasse les gaz brûlés.</li>
</ol>
<h2>Le vocabulaire</h2>
<ul>
<li><strong>PMH / PMB</strong> : point mort haut et point mort bas, les deux positions extrêmes du piston.</li>
<li><strong>Alésage</strong> : diamètre du cylindre. <strong>Course</strong> : distance PMH-PMB.</li>
<li><strong>Taux de compression</strong> : rapport entre le volume au PMB et au PMH. Le M112 de ta C 240 est à 10,5:1 ${s('mb')}.</li>
</ul>
<h2>Calcule la cylindrée de ton moteur</h2>
<p>Cylindrée = π/4 × alésage² × course × nombre de cylindres. Avec l’alésage de 89,9 mm et la course de 68,2 mm du M112.912 ${s('mb')} :</p>
<p class="mono">0,7854 × 8,99² × 6,82 × 6 ≈ 2 597 cm³</p>
<p>C’est exactement la cylindrée officielle. Le moteur est dit « super-carré » : son alésage est plus grand que sa course, ce qui favorise les hauts régimes.</p>
<h2>Couple et puissance</h2>
<p>Le couple est la force de rotation (en N·m), la puissance est ce couple multiplié par la vitesse de rotation. La formule utile : <span class="mono">P (kW) = C (N·m) × régime (tr/min) ÷ 9 549</span>.</p>
<p>Ton M112 donne 240 N·m à 4 500 tr/min et 125 kW (170 ch) à 5 500 tr/min ${s('mb')}. À 5 500 tr/min, le couple est donc d’environ 125 × 9 549 ÷ 5 500 ≈ 217 N·m : il a déjà commencé à baisser, mais le régime plus élevé fait monter la puissance.</p>
${key(['Un seul temps moteur sur quatre.', 'Deux tours de vilebrequin par cycle.', 'M112.912 : 89,9 × 68,2 mm, 2 597 cm³, 10,5:1.', 'P = C × régime ÷ 9 549.'])}`,
    quiz: [

<h2>L’huile</h2>
<p>Elle lubrifie, refroidit les pièces que l’eau n’atteint pas (pistons, paliers), nettoie et transporte les impuretés vers le filtre. Une pompe entraînée par le moteur la met sous pression ; un filtre la nettoie ; le carter la stocke.</p>

<h2>Le refroidissement</h2>
<ul>
<li><strong>Pompe à eau</strong> : entraînée par la courroie, elle fait circuler le liquide.</li>

    body: `
<h2>Le freinage hydraulique</h2>
<p>Le principe de Pascal : une pression appliquée sur un liquide se transmet partout. La pédale pousse le maître-cylindre, le liquide pousse les pistons d’étrier, les plaquettes serrent le disque. Le <strong>servofrein</strong> (à dépression) multiplie l’effort de ton pied.</p>
<p>Le liquide de frein absorbe l’humidité de l’air : son point d’ébullition baisse avec les années. À chaud, des bulles de vapeur se forment et la pédale devient molle. D’où le remplacement tous les deux ans.</p>
<p><strong>ABS</strong> : empêche le blocage des roues. <strong>ESP</strong> : freine une roue à la fois pour corriger une glissade. <strong>BAS</strong> : détecte un freinage d’urgence et donne toute la pression.</p>

<h2>La suspension</h2>
<ul>
<li><strong>Ressort</strong> : porte la voiture.</li>
<li><strong>Amortisseur</strong> : freine les oscillations du ressort. Sans lui, la voiture rebondit.</li>
<li><strong>Barre stabilisatrice</strong> : limite le roulis en virage, reliée aux roues par des biellettes.</li>
<li><strong>Silentblocs et rotules</strong> : articulations en caoutchouc et à billes. Ce sont elles qui s’usent et font du bruit.</li>
</ul>
<h2>La géométrie</h2>
<ul>
<li><strong>Parallélisme</strong> : orientation des roues vues de dessus. Un mauvais réglage use l’intérieur ou l’extérieur des pneus.</li>
<li><strong>Carrossage</strong> : inclinaison des roues vues de face.</li>
<li><strong>Chasse</strong> : inclinaison de l’axe de pivot. Elle ramène le volant au centre.</li>
</ul>
<p>Après tout remplacement de biellette de direction, de bras ou de berceau : contrôle de géométrie en atelier.</p>

<h2>L’analogie de l’eau</h2>
<ul>
<li><strong>Tension (V)</strong> : la pression. La batterie pousse les électrons à environ 12,6 V moteur arrêté.</li>
<li><strong>Courant (A)</strong> : le débit. Ce qui circule réellement dans le fil.</li>

<h2>La loi d’Ohm</h2>
<p class="mono">U = R × I &nbsp;·&nbsp; P = U × I</p>
<p>Exemple : une ampoule de 55 W sous 12 V consomme 55 ÷ 12 ≈ 4,6 A. Un ventilateur de radiateur peut en consommer bien plus : c’est pourquoi il a un fusible de forte intensité.</p>
<h2>Un circuit, c’est une boucle</h2>
<p>Le courant part du + de la batterie, passe par un fusible, un interrupteur ou un relais, le consommateur, puis revient au – par la <strong>masse</strong> (la carrosserie et le bloc moteur). Une masse mal serrée coupe le circuit aussi sûrement qu’un fil coupé.</p>

${fig(D.v6, 'Vue de dessus, avant en haut. Numérotation et ordre d’allumage habituels chez Mercedes, à confirmer dans WIS.')}
<h2>Les choix de conception</h2>
${table(['Élément', 'Solution M112', 'Source'], [
  ['Bloc', 'Alliage d’aluminium avec chemises en alliage aluminium-silicium (Silitec / Alusil)', s('frm')],
  ['Angle du V', '90°', s('mb')],
  ['Équilibrage', 'Arbre d’équilibrage dans le V, contrarotatif, à la vitesse du vilebrequin', s('frm')],
  ['Distribution', 'Un arbre à cames en tête par banc, chaîne à double rouleau', s('mb')],
  ['Soupapes', 'Deux d’admission, une d’échappement, par culbuteurs à rouleaux', s('mb')],
  ['Allumage', 'Deux bougies par cylindre', s('frm')],
  ['Admission', 'Collecteur en magnésium à double longueur', s('frm')],
  ['Bielles', 'Acier forgé', s('frm')],
  ['Injection', 'Séquentielle multipoint, gestion Bosch ME', s('mb')]
])}
<h2>Pourquoi trois soupapes et deux bougies ?</h2>
<p>Une seule soupape d’échappement par cylindre et des conduits courts réduisent les pertes de chaleur vers la culasse : les gaz arrivent plus chauds aux catalyseurs, qui atteignent plus vite leur température de travail. Les deux bougies compensent la chambre plus large en accélérant la combustion ${s('gen')}.</p>
<h2>Ce que ça implique pour toi</h2>
<ul>
<li><strong>Bloc à chemises Al-Si</strong> : pas de réalésage classique. Un moteur usé à l’intérieur se remplace plutôt qu’il ne se refait.</li>
<li><strong>12 bougies et 6 bobines à double sortie</strong> : l’entretien de l’allumage est plus long que sur un 6 cylindres classique.</li>
<li><strong>Pièces caoutchouc vieillissantes</strong> : à 25 ans, durites de reniflard, soufflets, joints et supports sont les premières causes de panne.</li>
<li><strong>Un seul capteur d’arbre à cames</strong> sur le M112 ${s('frm')}, avec un risque connu de fuite d’huile dans le faisceau.</li>
</ul>
${key(['V6 90° alu, 3 soupapes, 2 bougies, 1 ACT par banc.', 'Chaîne à double rouleau, arbre d’équilibrage.', 'Les caoutchoucs vieillis font l’essentiel des pannes.'])}`,
    quiz: [
      { q: 'Combien de soupapes d’échappement par cylindre sur le M112 ?', o: ['1', '2', '3'], a: 0, x: '2 admission + 1 échappement.' },
      { q: 'Pourquoi un bloc à chemises aluminium-silicium change-t-il la réparation ?', o: ['Il rouille', 'Il ne se réalèse pas comme une fonte', 'Il demande une huile spéciale'], a: 1, x: 'La surface des cylindres est traitée dans la masse : pas de réalésage classique.' }
    ] },
  { id: 'gestion-me', title: 'Gestion moteur ME & capteurs', min: 12,
    lead: 'Le calculateur pilote l’injection, l’allumage et le papillon à partir d’une douzaine de capteurs.',
    body: `
<p>Le M112 de la W203 est géré par un calculateur Bosch ME ${s('mb')} (version ME 2.8 généralement citée ${s('chk')}). L’accélérateur est électronique : la pédale envoie une consigne, un moteur électrique ouvre le papillon.</p>
${table(['Capteur / actionneur', 'Rôle', 'Si défaillant'], [
  ['Débitmètre à film chaud (HFM)', 'Masse d’air aspirée, souvent avec température d’air intégrée', 'Manque de puissance, mélange faux, P0100–P0104'],
  ['Capteur de vilebrequin', 'Régime et position', 'Non-démarrage, calages, compte-tours à zéro au démarreur'],
  ['Capteur d’arbre à cames', 'Identifie le cycle de chaque cylindre', 'Démarrage plus long, P0340, fuite d’huile dans le faisceau'],
  ['Capteurs de cliquetis', 'Détectent la détonation, le calculateur retarde l’avance', 'Perte de puissance, P0325/P0330'],
  ['Sondes lambda amont', 'Teneur en oxygène avant catalyseur, régulation du mélange', 'Mélange faux, consommation, P0130–P0155'],
  ['Sondes lambda aval', 'Surveillance des catalyseurs', 'P0136/P0156, P0420/P0430'],
  ['Température de liquide', 'Enrichissement à froid, ventilateur, jauge', 'Démarrage difficile, ventilateur permanent, P0115–P0118'],
  ['Papillon motorisé + pédale', 'Dosage de l’air, ralenti', 'Mode dégradé (puissance limitée), ralenti instable'],
  ['Clapet d’admission (longueur variable)', 'Change la longueur des conduits selon le régime', 'Trou de couple à certains régimes'],
  ['Électrovanne de purge du canister', 'Aspire les vapeurs d’essence du réservoir', 'Prise d’air si bloquée ouverte, codes EVAP'],
  ['Pompe d’air secondaire (si équipée)', 'Chauffe les catalyseurs au démarrage à froid', 'P0410/P0411']

<h2>Le mode dégradé moteur</h2>
<p>Quand une information essentielle manque (pédale, papillon), le calculateur limite l’ouverture du papillon et allume le voyant. La voiture roule, mais avec peu de puissance. Ce n’est pas une panne en soi : c’est une protection. Lis les codes.</p>
${tip(`<p>Un défaut moteur peut éteindre l’ESP et le régulateur de vitesse : ces systèmes ont besoin d’informations moteur fiables. Corrige d’abord le moteur.</p>`)}
${key(['Accélérateur électronique : papillon motorisé.', 'Sans capteur de vilebrequin, pas de démarrage.', 'Mode dégradé = protection, lire les codes.'])}`,
    quiz: [
      { q: 'Quel capteur, s’il lâche, empêche tout démarrage ?', o: ['Sonde lambda aval', 'Capteur de vilebrequin', 'Capteur de cliquetis'], a: 1, x: 'Sans régime ni position, ni injection ni allumage.' },
      { q: 'La sonde lambda aval sert surtout à…', o: ['Régler le mélange', 'Surveiller l’efficacité du catalyseur', 'Mesurer la température'], a: 1, x: 'La régulation se fait sur l’amont ; l’aval surveille le catalyseur.' }
    ] },
  { id: 'allumage', title: 'Allumage double : bobines et fils', min: 11,
    lead: 'Les ratés d’allumage du M112 se diagnostiquent avec méthode, cylindre par cylindre.',
    body: `
<h2>Le système</h2>
<p>Le M112 utilise des <strong>bobines à double sortie</strong> et des <strong>fils haute tension</strong> : chaque bobine alimente deux bougies, l’une directement, l’autre par un fil ${s('frm')}. L’appariement exact des bougies (même cylindre ou cylindre jumeau) est donné par le schéma WIS ${s('chk')} : repère chaque fil avant dépose et ne te fie pas à ta mémoire.</p>
<h2>Les causes de ratés, par fréquence</h2>
<ol>
<li>Bougies usées : l’écartement grandit, la bobine force et finit par claquer ${s('frm')}.</li>
<li>Capuchons ou fils fissurés, avec traces de claquage (traits noirs, « chemins » de carbone).</li>
<li>Bobine défaillante, souvent à chaud ou sous charge.</li>
<li>Huile dans un puits de bougie (fuite de couvre-culasse) qui court-circuite le capuchon.</li>
<li>Injecteur encrassé ou fuite d’air près d’un cylindre.</li>
<li>Problème mécanique (compression).</li>
</ol>
<h2>La méthode de l’échange</h2>
${steps([
  'Lis les codes : <span class="mono">P0301</span> à <span class="mono">P0306</span> désignent un cylindre, <span class="mono">P0300</span> des ratés aléatoires.',
  'Note le cylindre en cause, efface les codes.',
  'Échange la bobine de ce cylindre avec celle d’un cylindre voisin (même type). Repère tout.',
  'Roule dans les conditions qui provoquaient les ratés et relis les codes.',
  'Si le raté a suivi la bobine : bobine. S’il est resté : échange les bougies, puis vérifie fil, injecteur, compression.'
])}
${tip(`<p>Dans l’obscurité, moteur au ralenti, un léger brumisateur d’eau sur les fils et capuchons fait parfois apparaître les petits arcs de claquage. Ne touche à rien pendant ce test : haute tension.</p>`)}
${danger(`<p>Ne débranche jamais une bobine moteur tournant pour « trouver le cylindre mort » : la haute tension peut chercher une masse à travers toi ou détruire l’étage de puissance du calculateur.</p>`)}
${key(['Ratés : bougies d’abord, puis capuchons, fils, bobines.', 'Échange méthodique : le défaut suit-il la pièce ?', 'Huile dans un puits = joint de couvre-culasse.'])}`,
    quiz: [
      { q: 'Code P0303. Tu échanges la bobine 3 avec la 2 et le code devient P0302. Conclusion ?', o: ['Bougie 3', 'Bobine défaillante', 'Injecteur 3'], a: 1, x: 'Le défaut a suivi la bobine.' },
      { q: 'Que signifie P0300 ?', o: ['Raté sur le cylindre 3', 'Ratés aléatoires sur plusieurs cylindres', 'Défaut de bobine 0'], a: 1, x: 'P0300 = ratés aléatoires ou multiples.' }
    ] },
  { id: 'reniflard', title: 'Le reniflard : la panne n°1 du M112', min: 14,
    lead: 'Des durites en caoutchouc durcies par 25 ans de chaleur. Elles font des prises d’air et des fuites d’huile.',
    body: `
<h2>À quoi sert le reniflard</h2>
<p>Une petite partie des gaz de combustion passe entre les segments et le cylindre : ce sont les gaz de carter. Le système de ventilation du carter les renvoie vers l’admission pour les brûler, au lieu de les rejeter dans l’air. Il garde aussi le carter en légère dépression, ce qui limite les fuites d’huile.</p>
<h2>Le problème sur le M112</h2>
<p>Les durites de reniflard sont réputées pour durcir et se fissurer avec l’âge ${s('frm')}. Deux scénarios :</p>
<ul>
<li><strong>Durite fissurée</strong> : de l’air non mesuré entre dans le moteur. Ralenti instable, sifflement, codes de mélange pauvre.</li>
<li><strong>Durite ou passage bouché</strong> : le carter monte en pression. L’huile sort par les joints (couvre-culasses, joints spi), consommation d’huile, huile dans l’admission.</li>
</ul>
${table(['Symptôme', 'Codes typiques'], [
  ['Ralenti instable, sifflement', 'P0170 / P0173 (adaptation de mélange banc 1 / banc 2)'],
  ['Mélange pauvre', 'P0171 / P0174 (pauvre banc 1 / banc 2)'],
  ['Consommation d’huile, fuites multiples', 'Aucun code, mais huile dans le soufflet et le boîtier papillon']
])}
<h2>Diagnostic</h2>
${steps([
  'Corrections de mélange en données en direct : pauvres au ralenti sur les deux bancs, plus normales en charge ? Prise d’air probable.',
  'Inspection visuelle et au toucher : une durite saine est souple. Une durite qui ne s’écrase plus entre les doigts est à changer.',
  'Test à la fumée pour localiser la fuite exacte.'
])}
<h2>Les pièces</h2>
<p>Commande les durites par VIN ou par référence (famille <span class="mono">112 018 .. 82</span> pour le M112) ${s('frm')}. Attention : certains kits « M112/M113 » vendus aux États-Unis ne conviennent pas à la C 240 dont l’implantation diffère ${s('frm')}. Change toutes les durites du circuit en une fois.</p>
<h2>Procédure générale</h2>
${steps([
  'Moteur froid. Photographie tout l’environnement sous plusieurs angles.',
  'Dépose ce qui donne l’accès : conduits d’air, soufflet, éventuellement débitmètre (sans toucher l’élément de mesure). Selon l’emplacement exact sur ta voiture, d’autres pièces peuvent gêner ' + s('chk') + '.',
  'Repère chaque raccord. Coupe délicatement les vieilles durites durcies plutôt que de forcer : les raccords plastique se cassent. S’ils sont intacts, ils se réutilisent ' + s('frm') + '.',
  'Nettoie les embouts. Emmanche les durites neuves avec un film de graisse silicone.',
  'Remonte, contrôle chaque collier et chaque connecteur.',
  'Démarre, écoute (plus de sifflement), refais un test à la fumée si tu en as un.',
  'Efface les codes. Les corrections long terme se réapprennent en roulant ; surveille-les sur quelques trajets.'
])}
${tip(`<p>Profite de l’accès pour inspecter le soufflet d’admission et les petites durites de dépression voisines : elles ont le même âge.</p>`)}
${key(['Durites durcies = prises d’air ou surpression de carter.', 'Codes P0170/P0173 et P0171/P0174.', 'Toutes les durites en une fois, références par VIN.'])}`,
    quiz: [
      { q: 'Une durite de reniflard fissurée provoque surtout…', o: ['Un mélange riche', 'Une prise d’air et un mélange pauvre', 'Une surchauffe'], a: 1, x: 'L’air entre sans être mesuré par le débitmètre.' },
      { q: 'Un reniflard bouché provoque plutôt…', o: ['Des fuites d’huile par surpression de carter', 'Un mélange pauvre', 'Un non-démarrage'], a: 0, x: 'La pression de carter pousse l’huile par les joints.' },
      { q: 'Que fais-tu d’une vieille durite collée sur un raccord plastique ?', o: ['Je tire fort', 'Je la coupe délicatement pour préserver le raccord', 'Je chauffe au chalumeau'], a: 1, x: 'Les raccords plastique vieillis cassent facilement.' }
    ] },
  { id: 'fuite-support-filtre', title: 'Fuite d’huile au support de filtre / échangeur', min: 11,
    lead: 'Une fuite classique du M112, discrète au début, qui finit sur l’échappement et la boîte.',
    body: `
<h2>Le problème</h2>
<p>Le support du filtre à huile intègre un échangeur thermique. Ses joints vieillissent et fuient ${s('frm')}. L’huile s’accumule dans le V du moteur et descend vers l’arrière, sur le carter de boîte, parfois sur l’échappement.</p>
${table(['Indice', 'Ce que tu observes'], [

  ['Odeur', 'Huile brûlée après un trajet'],
  ['Niveau', 'Appoints d’huile réguliers sans fumée à l’échappement']
])}
<h2>Confirmer la source</h2>
${steps([
  'Dégraisse soigneusement la zone (moteur froid, protège les connecteurs).',
  'Roule une ou deux fois, puis inspecte avec une lampe et un miroir.',
  'Suis la trace vers le haut : la source est toujours au point le plus haut de la trace humide.',
  'Écarte les autres sources : couvre-culasses, bouchon de remplissage, durites de reniflard, capteurs.'
])}
${warn(`<p>Si l’échangeur échange aussi de la chaleur avec le liquide de refroidissement, un défaut interne peut mélanger les deux fluides ${s('chk')}. Surveille l’aspect de l’huile (laiteuse ?) et du liquide de refroidissement (traces grasses ?). Un mélange est une urgence.</p>`)}
<h2>La réparation</h2>
<p>L’accès passe en général par la dépose du collecteur d’admission : c’est un travail de niveau 3, long, qui se fait avec la procédure WIS sous les yeux ${s('chk')}.</p>
${steps([
  'Batterie débranchée. Photos et repères sur chaque connecteur et chaque durite de dépression.',
  'Dépose du collecteur d’admission selon WIS. Obture immédiatement les conduits d’admission avec du ruban ou des chiffons propres.',
  'Dépose du support, nettoyage parfait des plans de joint au grattoir plastique.',
  'Joints neufs, serrage des vis au couple WIS, dans l’ordre prescrit.',
  'Joints de collecteur neufs, remontage, contrôle de chaque raccord.',
  'Niveau d’huile (et de liquide de refroidissement si touché), démarrage, contrôle de fuite, test à la fumée de l’admission.'
])}
${tip(`<p>Collecteur déposé, c’est le moment de remplacer les durites de reniflard et d’inspecter les injecteurs et leurs joints : même accès, même âge.</p>`)}
${key(['Huile dans le V et à l’arrière du bloc = support de filtre suspect.', 'Toujours remonter à la source la plus haute.', 'Réparation via dépose du collecteur, joints de collecteur neufs.'])}`,
    quiz: [
      { q: 'Où se trouve la source d’une fuite d’huile ?', o: ['Au point le plus bas de la trace', 'Au point le plus haut de la trace humide', 'Là où ça goutte'], a: 1, x: 'L’huile coule vers le bas : on remonte la trace.' },
      { q: 'Collecteur d’admission déposé, que fais-tu en plus ?', o: ['Rien', 'Durites de reniflard et inspection des injecteurs', 'Vidange de boîte'], a: 1, x: 'Même accès, mêmes pièces vieillissantes.' }
    ] },
  { id: 'capteur-came', title: 'Capteur d’arbre à cames & huile dans le faisceau', min: 10,
    lead: 'Une petite fuite qui peut finir dans le calculateur moteur.',
    body: `
<h2>Le problème</h2>
<p>Le M112 n’a qu’un capteur d’arbre à cames ${s('frm')}. Avec l’âge, l’huile du moteur peut traverser le capteur jusqu’à son connecteur. Par capillarité, elle remonte ensuite dans le faisceau électrique, parfois jusqu’au calculateur moteur ${s('frm')}. Le calculateur et le faisceau peuvent alors devoir être nettoyés ou remplacés : une réparation très coûteuse.</p>
<h2>Contrôle préventif (10 minutes)</h2>
${steps([
  'Localise le capteur (à l’avant d’une culasse, côté distribution ' + s('chk') + ').',
  'Débranche son connecteur, contact coupé.',
  'Regarde à l’intérieur : il doit être sec. Un film d’huile ou des gouttes = fuite à traiter.',
  'Si c’est huileux, débranche le connecteur suivant sur le faisceau et regarde jusqu’où l’huile est allée.'
])}
<h2>La réparation</h2>
<ul>
<li>Remplace le capteur et son joint torique.</li>
<li>Nettoie les connecteurs au nettoyant contact, laisse sécher complètement.</li>
<li>Mercedes et les ateliers montent un <strong>faisceau intermédiaire</strong> (rallonge courte) entre le capteur et le faisceau principal : si le nouveau capteur fuit un jour, l’huile s’arrête dans cette rallonge peu coûteuse ${s('frm')}.</li>
<li>Si l’huile a atteint le connecteur du calculateur, fais-le traiter par un spécialiste : nettoyage du faisceau et du calculateur, ou remplacement.</li>
</ul>
${w203(`<p>Le même phénomène existe sur la boîte 722.6 avec le connecteur 13 broches : l’ATF peut remonter jusqu’au calculateur de boîte. Contrôle les deux en même temps.</p>`)}
${key(['Contrôle annuel du connecteur du capteur.', 'Capteur neuf + connecteurs nettoyés + rallonge-barrière.', 'Huile au calculateur = spécialiste.'])}`,
    quiz: [
      { q: 'Pourquoi monter un faisceau intermédiaire après le capteur ?', o: ['Pour rallonger', 'Pour arrêter l’huile dans une pièce bon marché si une fuite revient', 'Pour améliorer le signal'], a: 1, x: 'C’est une barrière sacrificielle.' }
    ] },
  { id: 'poulie', title: 'La poulie amortisseur (harmonic balancer)', min: 10,
    lead: 'Une pièce de caoutchouc et d’acier qui protège le vilebrequin. Quand elle se délamine, c’est une urgence.',
    body: `
<h2>Son rôle</h2>
<p>Le vilebrequin subit des vibrations de torsion à chaque combustion. La poulie amortisseur, fixée à son extrémité avant, absorbe ces vibrations grâce à une couronne d’acier liée au moyeu par du caoutchouc. Elle entraîne aussi la courroie d’accessoires.</p>
<h2>La panne</h2>
<p>Avec l’âge, le caoutchouc se fissure et se décolle. La couronne extérieure se décale, puis peut se désolidariser ${s('frm')}. Sans amortissement, les vibrations fatiguent le vilebrequin et ses coussinets ${s('frm')}.</p>
${table(['Signe', 'Ce que tu vois ou sens'], [
  ['Caoutchouc', 'Fissures, gonflement ou caoutchouc qui sort entre moyeu et couronne'],
  ['Repères', 'Décalage entre les repères ou des marques peintes sur moyeu et couronne'],
  ['Voile', 'La poulie « louvoie » moteur tournant (observe de loin, en sécurité)'],
  ['Courroie', 'Courroie qui se décale ou s’use sur un bord'],
  ['Moteur', 'Vibrations nouvelles, bruit de frottement à l’avant']
])}
<h2>Inspection</h2>
${steps([
  'Moteur coupé, clé retirée. Lampe puissante.',
  'Inspecte toute la circonférence du caoutchouc, en tournant le moteur par la vis de vilebrequin si besoin (sens de rotation normal).',
  'Trace un trait de peinture continu sur le moyeu et la couronne : un décalage plus tard prouvera un glissement.'
])}
<h2>Remplacement</h2>
<ul>
<li>Outil de maintien de poulie spécifique M112/M113 ${s('frm')}, extracteur.</li>
<li>La vis centrale de vilebrequin est serrée très fort, avec un serrage au couple puis à l’angle. Valeur et vis neuve : WIS ${s('chk')}.</li>
<li>Courroie à remplacer en même temps si elle a frotté.</li>
</ul>
${danger(`<p>Une couronne qui se décale se surveille de près et se remplace vite. Si elle se détache en roulant, elle peut détruire la courroie, le radiateur et ce qui l’entoure.</p>`)}
${key(['Caoutchouc fissuré ou couronne décalée = remplacement.', 'Trait de peinture témoin.', 'Vis de vilebrequin : couple + angle WIS, outil de maintien.'])}`,
    quiz: [
      { q: 'Quel est le rôle principal de la poulie amortisseur ?', o: ['Tendre la courroie', 'Absorber les vibrations de torsion du vilebrequin', 'Refroidir l’huile'], a: 1, x: 'Elle protège le vilebrequin des vibrations.' },
      { q: 'À quoi sert un trait de peinture entre moyeu et couronne ?', o: ['Décoration', 'Révéler un glissement de la couronne', 'Repérer le PMH'], a: 1, x: 'Si le trait se décale, le caoutchouc glisse.' }
    ] },
  { id: 'refroid-m112', title: 'Thermostat, pompe à eau, ventilateur', min: 12,
    lead: 'Le circuit de refroidissement du M112 et ses pannes typiques sur la W203.',
    body: `
<h2>Thermostat</h2>
<p>Panne chronique sur la W203 : il reste ouvert ${s('frm')}.</p>
<ul>
<li>Symptômes : la température plafonne sous 80 °C, surtout sur route ou autoroute en hiver ; chauffage tiède ; consommation en hausse ; code <span class="mono">P0128</span>.</li>
<li>Sur le M112 de la C 240, le thermostat se remplace avec son boîtier (référence citée : <span class="mono">112 203 02 75</span>) ${s('frm')}.</li>
<li>Procédure : <a href="#l-p-thermostat">Projet « Remplacer le thermostat »</a>.</li>
</ul>
<h2>Pompe à eau</h2>
<ul>
<li>Traces de liquide séché sous la pompe ou goutte au trou témoin : joint interne qui fuit.</li>
<li>Bruit de roulement ou jeu de la poulie (courroie déposée).</li>
<li>Une pompe qui fuit ne se répare pas : elle se remplace, joint neuf, avec une vidange du circuit.</li>
</ul>
<h2>Ventilateur électrique</h2>
<p>Ventilateur aspirant derrière le radiateur, avec électronique de commande intégrée et fusible de forte intensité ${s('frm')}.</p>
<ul>
<li>Clim en marche : il doit tourner. S’il ne tourne jamais : fusible, connecteur, module du ventilateur.</li>
<li>S’il tourne en permanence à fond : souvent une information de température absente ou un module en mode secours.</li>
</ul>
<h2>Vase d’expansion, durites, radiateur</h2>
<ul>
<li>Le plastique vieillit : fissures fines sur le vase, souvent autour des soudures et des embouts.</li>
<li>Durites gonflées, molles ou craquelées à remplacer.</li>

<h2>Le débitmètre (HFM)</h2>
<ul>
<li>Un débitmètre fatigué sous-estime l’air : manque de puissance, mélange qui dérive, corrections positives partout.</li>

function vModule(m) {

function quizHTML(key, items, title) {
  const st = QS[key] || (QS[key] = { ans: {} });
  const qs = items.map((q, k) => {
    const a = st.ans[k];
    return `<div class="q" id="q-${key}-${k}"><p class="q-text">${k + 1}. ${q.q}</p><div class="opts">${q.o.map((o, j) => {
      let cls = 'opt';
      if (a != null) { if (j === q.a) cls += ' right'; else if (j === a) cls += ' wrong'; }
      return `<button class="${cls}" data-act="ans" data-k="${key}" data-q="${k}" data-o="${j}"${a != null ? ' disabled' : ''}>${o}</button>`;
    }).join('')}</div><p class="q-x"${a != null ? '' : ' hidden'}>${a === q.a ? 'Exact. ' : 'Pas tout à fait. '}${q.x}</p></div>`;
  }).join('');
  const nAns = Object.keys(st.ans).length;
  const good = items.filter((q, k) => st.ans[k] === q.a).length;
  return `<section class="quiz" id="quiz-${key}"><div class="quiz-head"><h2>${title}</h2><span class="mono muted tnum">${nAns}/${items.length}</span></div>${qs}${nAns === items.length ? `<div class="quiz-result">Score : ${good}/${items.length}${key !== 'rev' ? ' · leçon enregistrée comme terminée' : ''}</div>` : ''}</section>`;
}

</article>`;

function vRevision() {
  if (!REV) newRevision();
  const items = REV.map((r) => r.q);
  return `<nav class="crumbs"><a href="#cursus">Cursus</a><span>›</span><span>Révision</span></nav>
  <div class="section-head"><div class="stack" style="gap:6px"><p class="eyebrow">${REV.src}</p><h1>Révision</h1></div><button class="btn quiet" data-act="rev-new">Nouveau tirage</button></div>
  <div class="lesson" style="margin:0;max-width:760px">${quizHTML('rev', items, 'Dix questions')}<p class="muted" style="font-size:.86rem;margin-top:12px">${REV.map((r, k) => `${k + 1}. <a href="#l-${r.lid}">${LMAP[r.lid].title}</a>`).join(' · ')}</p></div>`;
}
function newRevision() {
  let pool = [];
  const done = LESSONS.filter((l) => S.done[l.id] && l.quiz);
  const src = done.reduce((n, l) => n + l.quiz.length, 0) >= 10 ? done : LESSONS.filter((l) => l.quiz);
  src.forEach((l) => l.quiz.forEach((q) => pool.push({ lid: l.id, q })));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  REV = pool.slice(0, 10); REV.src = src === done ? 'Tirées dans tes leçons terminées' : 'Tirées dans tout le cursus';
  delete QS.rev;
}

function vTree(t) {

/* ---------- Mon garage ---------- */
function showDate(d) {
  if (!d) return '';
  if (/^\d{4}-\d{2}$/.test(d)) { const [y, m] = d.split('-'); return ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'][+m - 1] + ' ' + y; }
  const t = new Date(d); return isNaN(t) ? d : t.toLocaleDateString('fr-FR');
}
function due(p) {
  const st = S.plan[p.id] || {}; const cur = +S.car.km || 0; const parts = []; let cls = 'ok', any = false;
  if (p.km && st.km) {
    any = true; const left = (+st.km + p.km) - cur;
    if (left <= 0) { cls = 'late'; parts.push('dépassé de ' + fmt(-left) + ' km'); } else { parts.push('dans ' + fmt(left) + ' km'); if (left < p.km * 0.1) cls = 'soon'; }
  }
  if (p.mo && st.date) {
    const d = new Date(st.date.length === 7 ? st.date + '-01' : st.date);
    if (!isNaN(d)) {
      any = true; const nx = new Date(d); nx.setMonth(nx.getMonth() + p.mo); const days = Math.round((nx - Date.now()) / 864e5);
      if (days <= 0) { cls = 'late'; parts.push('en retard de ' + fmt(-days) + ' j'); } else { parts.push('dans ' + fmt(days) + ' j'); if (days < 45 && cls !== 'late') cls = 'soon'; }
    }
  }
  return any ? { cls, txt: parts.join(' · ') } : { cls: '', txt: 'Renseigne la dernière fois' };
}
function planRows() {
  return R.plan.map((p) => { const st = S.plan[p.id] || {}; const d = due(p); return `<div class="plan-row"><div><b>${p.item}</b><small>Tous les ${intervalText(p)}</small></div>
    ${p.km ? `<label class="lbl">Fait à (km)<input class="input tnum" type="number" inputmode="numeric" id="pk-${p.id}" data-plan-km="${p.id}" value="${esc(st.km || '')}"></label>` : '<span></span>'}
    <label class="lbl">Fait le<input class="input" type="date" id="pd-${p.id}" data-plan-date="${p.id}" value="${esc(st.date && st.date.length === 10 ? st.date : '')}"></label>
    <span class="due ${d.cls}" id="due-${p.id}">${d.txt}</span></div>`; }).join('');
}
function logRows() {
  if (!S.log.length) return '<div class="empty">Aucune entrée. Ajoute ta première intervention ci-dessus.</div>';
  return S.log.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map((x) => `<div class="log-item"><div><span class="meta">${showDate(x.date)}${x.km ? ' · ' + fmt(x.km) + ' km' : ''}${x.ex ? ' · pré-rempli' : ''}</span><p><b>${esc(x.what)}</b></p>${x.notes ? `<p class="muted">${esc(x.notes)}</p>` : ''}</div><button class="btn quiet small" data-act="log-del" data-id="${esc(x.id)}" aria-label="Supprimer l’entrée">Supprimer</button></div>`).join('');
}

function navKey(h) {
  if (h === 'revision') return 'revision';

/* ---------- Calculs ---------- */
function calcCrowfoot() {
  const out = $('#cf-out'); if (!out) return;
  const t = parseFloat($('#cf-t').value), L = parseFloat($('#cf-l').value), E = parseFloat($('#cf-e').value);
  if (!(t > 0 && L > 0 && E >= 0)) { out.textContent = 'Renseigne les trois valeurs.'; return; }
  out.textContent = 'Règle la clé sur ' + (t * L / (L + E)).toFixed(1).replace('.', ',') + ' N·m';
}
function convert(from) {
  const nmEl = $('#cv-nm'), lbEl = $('#cv-lbf'), kgEl = $('#cv-kgf');
  let nmv;
  if (from === 'nm') nmv = parseFloat(nmEl.value); else if (from === 'lbf') nmv = parseFloat(lbEl.value) / 0.737562; else nmv = parseFloat(kgEl.value) / 0.101972;
  if (isNaN(nmv)) return;
  if (from !== 'nm') nmEl.value = +nmv.toFixed(1);
  if (from !== 'lbf') lbEl.value = +(nmv * 0.737562).toFixed(1);
  if (from !== 'kgf') kgEl.value = +(nmv * 0.101972).toFixed(2);
}

/* ---------- Toast & copie ---------- */
let toastT;
function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
function logText() {
  const c = S.car;
  const lines = [c.modele + ' · ' + c.type + ' · ' + c.moteur, 'Kilométrage : ' + (c.km ? fmt(c.km) + ' km' : '—'), ''];
  S.log.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach((x) => { lines.push('- ' + showDate(x.date) + (x.km ? ' · ' + fmt(x.km) + ' km' : '') + ' : ' + x.what + (x.notes ? ' — ' + x.notes : '')); });
  return lines.join('\n');
}

/* ---------- Événements ---------- */
view.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'ans') {
    const key = b.dataset.k, k = +b.dataset.q, o = +b.dataset.o;
    const st = QS[key] || (QS[key] = { ans: {} }); if (st.ans[k] != null) return;
    st.ans[k] = o;
    const items = key === 'rev' ? REV.map((r) => r.q) : LMAP[key].quiz;
    if (Object.keys(st.ans).length === items.length && key !== 'rev') {
      const good = items.filter((q, i) => st.ans[i] === q.a).length;
      S.quiz[key] = Math.max(S.quiz[key] || 0, good); S.done[key] = true; save();
      const r0 = rank(xp() - 0); toast(good === items.length ? 'Sans faute · ' + r0.name : 'Quiz terminé : ' + good + '/' + items.length);
    }
    const sec = $('#quiz-' + key);
    if (sec) { sec.outerHTML = quizHTML(key, items, key === 'rev' ? 'Dix questions' : 'Quiz'); }
    const doneBtn = view.querySelector('[data-act="done"]');
    if (doneBtn && key !== 'rev' && S.done[key]) { doneBtn.classList.add('done'); doneBtn.textContent = 'Leçon terminée ✓'; }
    updateXp(); renderRail(decodeURIComponent((location.hash || '').slice(1)));
  } else if (act === 'done') {
    const id = b.dataset.l; S.done[id] = !S.done[id]; save();
    b.classList.toggle('done', !!S.done[id]); b.textContent = S.done[id] ? 'Leçon terminée ✓' : 'Marquer comme terminée';
    if (S.done[id]) toast('+20 XP · ' + rank(xp()).name);
    updateXp(); renderRail(decodeURIComponent((location.hash || '').slice(1)));
  } else if (act === 'tnext') {
    const t = TMAP[TREE.id], node = t.n[TREE.path[TREE.path.length - 1]], a = node.a[+b.dataset.i];
    TREE.picks.push(a[0]); TREE.path.push(a[1]); view.innerHTML = vTree(t); window.scrollTo(0, 0);
  } else if (act === 'tback') {
    TREE.path.pop(); TREE.picks.pop(); view.innerHTML = vTree(TMAP[TREE.id]);
  } else if (act === 'treset') {
    const t = TMAP[TREE.id]; TREE = null; view.innerHTML = vTree(t); window.scrollTo(0, 0);
  } else if (act === 'rev-new') {
    newRevision(); rerender();
  } else if (act === 'log-add') {
    const what = $('#lg-what').value.trim();
    if (!what) { toast('Indique l’intervention avant d’ajouter.'); $('#lg-what').focus(); return; }
    S.log.push({ id: 'x' + Date.now(), date: $('#lg-date').value || new Date().toISOString().slice(0, 10), km: $('#lg-km').value, what, notes: $('#lg-notes').value.trim() });
    save(); $('#lg-what').value = ''; $('#lg-notes').value = ''; $('#log-list').innerHTML = logRows(); toast('Ajouté au carnet');
  } else if (act === 'log-del') {
    S.log = S.log.filter((x) => x.id !== b.dataset.id); S.deleted[b.dataset.id] = Date.now(); save(); $('#log-list').innerHTML = logRows(); toast('Entrée supprimée');
  } else if (act === 'copy-log') {
    const txt = logText();
    const fallback = () => { const ta = $('#copy-fallback'); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast('Texte sélectionné : copie-le manuellement'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Carnet copié'), fallback); } catch (err) { fallback(); }
  } else if (act === 'dos-add') {
    S.dossiers.push({ id: 'd' + Date.now(), title: 'Nouveau dossier', status: 'afaire', lesson: '', notes: '' }); save(); rerender();
  } else if (act === 'dos-del') {
    S.dossiers = S.dossiers.filter((d) => d.id !== b.dataset.id); S.deleted[b.dataset.id] = Date.now(); save(); rerender(); toast('Dossier supprimé');
  } else if (act === 'acct-mode') {
    AUTH.mode = b.dataset.m; AUTH.err = ''; AUTH.msg = ''; rerender();
  } else if (act === 'acct-pwd') {
    AUTH.mode = 'newpass'; AUTH.err = ''; AUTH.msg = ''; rerender();
  } else if (act === 'acct-sync') {
    b.disabled = true; Cloud.pull().then(() => Cloud.flush()).then(() => { toast(Cloud.offline ? 'Serveur injoignable' : 'Synchronisé'); rerender(); });
  } else if (act === 'acct-logout') {
    b.disabled = true; Promise.resolve(Cloud.flush()).then(() => Cloud.sb.auth.signOut()).then(() => toast('Déconnecté')).catch(() => toast('Déconnexion impossible'));
  } else if (act === 'reset-progress') {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirmer la remise à zéro'; b.classList.remove('ghost'); return; }
    S.done = {}; S.quiz = {}; S.last = ''; S.resetAt = Date.now(); Object.keys(QS).forEach((k) => delete QS[k]); save(); rerender(); toast('Progression remise à zéro');
  }
});

/* ---------- Recherche ---------- */
const IDX = LESSONS.map((l) => ({ l, t: norm(l.title), b: norm(l.body.replace(/<[^>]+>/g, ' ')) }));
function search(q) {
  const toks = norm(q).split(/\s+/).filter((x) => x.length > 1);
  if (!toks.length) return '<p class="muted">Tape au moins deux lettres : bougie, P0171, ATF, biellette…</p>';
  const hit = (txt) => toks.every((t) => txt.includes(t));
  const ls = IDX.map((x) => ({ x, sc: (hit(x.t) ? 10 : 0) + (hit(x.b) ? 1 : 0) })).filter((r) => r.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 10);
  const tq = R.torques.filter((t) => hit(norm(t.part + ' ' + t.sys + ' ' + t.note)));
  const dc = R.dtc.filter((d) => hit(norm(d.join(' '))));
  const gl = R.gloss.filter((g) => hit(norm(g.join(' '))));
  const tr = W.trees.filter((t) => hit(norm(t.title + ' ' + t.desc)));
  let out = '';
  if (ls.length) out += `<div class="res-group"><h4>Leçons</h4>${ls.map((r) => `<a href="#l-${r.x.l.id}">${r.x.l.title}<small>${r.x.l.mod.code} · ${r.x.l.mod.title}</small></a>`).join('')}</div>`;
  if (tr.length) out += `<div class="res-group"><h4>Diagnostic guidé</h4>${tr.map((t) => `<a href="#t-${t.id}">${t.title}<small>${t.desc}</small></a>`).join('')}</div>`;
  if (tq.length) out += `<div class="res-group"><h4>Couples de serrage</h4>${tq.map((t) => `<a href="#ref-couples">${t.part} · <span class="mono">${t.val}</span><small>${t.sys} · source : ${W.SRC[t.src][0]}</small></a>`).join('')}</div>`;
  if (dc.length) out += `<div class="res-group"><h4>Codes défaut</h4>${dc.slice(0, 8).map((d) => `<a href="#codes">${d[0]} · ${d[1]}<small>${d[2]}</small></a>`).join('')}</div>`;
  if (gl.length) out += `<div class="res-group"><h4>Glossaire</h4>${gl.slice(0, 6).map((g) => `<a href="#ref-glossaire">${g[0]}<small>${g[2]}</small></a>`).join('')}</div>`;
  return out || '<p class="muted">Aucun résultat. Essaie un mot plus simple.</p>';
}
const panel = $('#search'), sq = $('#sq'), sr = $('#sr');
function openSearch() { panel.hidden = false; sq.value = ''; sr.innerHTML = search(''); setTimeout(() => sq.focus(), 30); }
function closeSearch() { panel.hidden = true; }
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-open-search]')) { openSearch(); return; }
  if (e.target.closest('[data-close-search]')) { closeSearch(); return; }
  if (!panel.hidden && e.target.closest('#sr a')) closeSearch();
});
sq.addEventListener('input', () => { sr.innerHTML = search(sq.value); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !panel.hidden) closeSearch();
  if (e.key === '/' && panel.hidden && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
});

view.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); if (!Cloud.sb || AUTH.busy) return;
  const kind = f.dataset.form, fd = new FormData(f), v = (k) => String(fd.get(k) || '').trim();
  const btn = f.querySelector('button[type="submit"]'), label = btn ? btn.textContent : '';
  const busy = (x) => { AUTH.busy = x; if (btn) { btn.disabled = x; btn.textContent = x ? 'Patiente…' : label; } };
  const redirect = location.origin + location.pathname;
  acctSay('', ''); busy(true);
  try {
    if (kind === 'login') {
      const id = v('login'), pwd = String(fd.get('password') || '');
      if (!id || !pwd) { acctSay('Renseigne ton e-mail (ou nom d’utilisateur) et ton mot de passe.'); return; }
      let email = id;
      if (!id.includes('@')) {
        const q = await Cloud.sb.rpc('resolve_login', { p_login: id, p_password: pwd });
        if (q.error) { acctSay(authErr(q.error)); return; }
        if (!q.data) { acctSay('Identifiant ou mot de passe incorrect. Après 10 essais, ce nom d’utilisateur est bloqué 15 minutes.'); return; }
        email = q.data;
      }
      const r = await Cloud.sb.auth.signInWithPassword({ email, password: pwd });
      if (r.error) { acctSay(authErr(r.error)); return; }
      AUTH.mode = 'login'; toast('Connecté');
    } else if (kind === 'signup') {
      const u = v('username'), em = v('email'), pw = String(fd.get('password') || '');
      if (!/^[A-Za-z0-9._-]{3,24}$/.test(u)) { acctSay('Nom d’utilisateur : 3 à 24 caractères, lettres sans accent, chiffres, point, tiret ou soulignement.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { acctSay('Adresse e-mail invalide.'); return; }
      if (pw.length < 8) { acctSay('Mot de passe : 8 caractères minimum.'); return; }
      if (pw !== String(fd.get('password2') || '')) { acctSay('Les deux mots de passe ne correspondent pas.'); return; }
      const a = await Cloud.sb.rpc('username_available', { p_username: u });
      if (a.error) { acctSay(authErr(a.error)); return; }
      if (a.data === false) { acctSay('Ce nom d’utilisateur est déjà pris.'); return; }
      const r = await Cloud.sb.auth.signUp({ email: em, password: pw, options: { data: { username: u }, emailRedirectTo: redirect } });
      if (r.error) { acctSay(authErr(r.error)); return; }
      if (r.data && r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0) { acctSay('Un compte existe déjà avec cette adresse e-mail.'); return; }
      if (!r.data.session) { AUTH.mode = 'login'; rerender(); acctSay('', 'Compte créé. Ouvre le lien de confirmation reçu par e-mail, puis connecte-toi ici.'); return; }
      toast('Compte créé. Bienvenue, ' + u + ' !');
    } else if (kind === 'forgot') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))) { acctSay('Adresse e-mail invalide.'); return; }
      const r = await Cloud.sb.auth.resetPasswordForEmail(v('email'), { redirectTo: redirect });
      if (r.error) { acctSay(authErr(r.error)); return; }
      acctSay('', 'Si un compte existe pour cette adresse, un lien vient d’être envoyé. Pense à vérifier les indésirables.');
    } else if (kind === 'newpass') {
      const p1 = String(fd.get('password') || ''), p2 = String(fd.get('password2') || '');
      if (p1.length < 8) { acctSay('Mot de passe : 8 caractères minimum.'); return; }
      if (p1 !== p2) { acctSay('Les deux mots de passe ne correspondent pas.'); return; }
      const r = await Cloud.sb.auth.updateUser({ password: p1 });
      if (r.error) { acctSay(authErr(r.error)); return; }
      AUTH.mode = 'login'; rerender(); acctSay('', 'Mot de passe modifié.');
    }
  } catch (err) { acctSay(authErr(err)); }
  finally { busy(false); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Cloud.pull(); else if (Cloud.on && S.dirty) Cloud.flush(); });

window.addEventListener('hashchange', route);
route();
Cloud.init();
})();
