<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="W203">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Académie W203</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cursus complet pour entretenir, diagnostiquer et réparer soi-même une Mercedes C 240 W203 (203.061) à moteur M112.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout : manuel d'atelier numérique — colonne de lecture ~68ch, rail de navigation à gauche sur grand écran, barre d'onglets en bas sur téléphone. Plaque constructeur en alu brossé comme signature. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#E3E8ED; --ink:#13181E; --muted:#56616E; --line:#CBD3DB;
  --accent:#1C5797; --accent-soft:#DCE6F2; --on-accent:#FFFFFF;
  --amber:#8F5400; --amber-soft:#F7E9CF; --red:#A3241A; --red-soft:#F6DDD9; --green:#1F6B45; --green-soft:#DAEEE2;
  --plate-a:#E6EAEE; --plate-b:#C8CFD6; --plate-ink:#28313A; --rivet:#9AA4AE;
  --shadow:0 1px 2px rgba(19,24,30,.06),0 6px 18px rgba(19,24,30,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --nav-h:64px; --head-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1115; --surface:#161A20; --surface-2:#1F252D; --ink:#E3E8EE; --muted:#9BA6B3; --line:#2C343E;
    --accent:#86B6EE; --accent-soft:#1A2A3E; --on-accent:#0E1115;
    --amber:#EAAE55; --amber-soft:#30250F; --red:#F28F84; --red-soft:#3A1D1A; --green:#74D1A0; --green-soft:#132E1F;
    --plate-a:#2A3038; --plate-b:#1B2027; --plate-ink:#CBD3DC; --rivet:#55606B;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1115; --surface:#161A20; --surface-2:#1F252D; --ink:#E3E8EE; --muted:#9BA6B3; --line:#2C343E;
  --accent:#86B6EE; --accent-soft:#1A2A3E; --on-accent:#0E1115;
  --amber:#EAAE55; --amber-soft:#30250F; --red:#F28F84; --red-soft:#3A1D1A; --green:#74D1A0; --green-soft:#132E1F;
  --plate-a:#2A3038; --plate-b:#1B2027; --plate-ink:#CBD3DC; --rivet:#55606B;
  --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--accent);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0;font-weight:600;letter-spacing:.005em}
h1{font-size:clamp(2rem,1.5rem + 2.2vw,2.9rem)}
h2{font-size:1.65rem}
h3{font-size:1.3rem}
h4{font-size:1.1rem}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);height:var(--head-h);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-size:1.45rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.88rem}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.xp-pill{font-family:var(--f-mono);font-size:.78rem;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.layout{display:grid;grid-template-columns:1fr;min-height:calc(100vh - var(--head-h))}
.rail{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{max-width:1040px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:500;letter-spacing:.02em}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--accent)}
.tabbar a.on svg{stroke-width:2.2}

@media (min-width:1000px){
  .layout{grid-template-columns:260px 1fr}
  .rail{display:block;position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--head-h) - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px 30px}
  .tabbar{display:none}
  main{padding-block:32px 60px}
}
.rail-nav{display:grid;gap:2px;margin-bottom:18px}
.rail-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem}
.rail-nav a svg{width:18px;height:18px;color:var(--muted)}
.rail-nav a:hover{background:var(--surface-2)}
.rail-nav a.on{background:var(--accent-soft);color:var(--accent)}
.rail-nav a.on svg{color:var(--accent)}
.rail h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:6px 10px 8px}
.rail-mods{display:grid;gap:1px}
.rail-mods a{display:grid;grid-template-columns:36px 1fr auto;gap:6px;align-items:center;padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-size:.86rem;line-height:1.25}
.rail-mods a:hover{background:var(--surface-2)}
.rail-mods a.on{background:var(--surface-2)}
.rail-mods .c{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.rail-mods .p{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}

/* ---------- Generic blocks ---------- */
.stack{display:grid;gap:20px}
.section{display:grid;gap:14px;margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 11px;font-size:.85rem}
.btn.done{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.03em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.lv0{color:var(--muted)} .chip.lv1{color:var(--accent);border-color:var(--accent)} .chip.lv2{color:var(--green);border-color:var(--green)} .chip.lv3{color:var(--amber);border-color:var(--amber)} .chip.lv4{color:var(--red);border-color:var(--red)}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
textarea.input{min-height:84px;resize:vertical}
label.lbl{display:grid;gap:5px;font-size:.84rem;color:var(--muted);font-weight:500}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}
@media (min-width:1000px){.toast{bottom:24px}}

/* ---------- Plate (signature) ---------- */
.plate{position:relative;border-radius:5px;border:1px solid var(--line);color:var(--plate-ink);padding:22px 24px 20px;
  background-color:var(--plate-a);
  background-image:
    radial-gradient(circle at 12px 12px,var(--rivet) 0 3px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 12px) 12px,var(--rivet) 0 3px,transparent 3.6px),
    radial-gradient(circle at 12px calc(100% - 12px),var(--rivet) 0 3px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),var(--rivet) 0 3px,transparent 3.6px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
    linear-gradient(160deg,var(--plate-a),var(--plate-b));
}
.plate-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--rivet);padding-bottom:8px;margin-bottom:12px}
.plate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:10px 18px;font-family:var(--f-mono)}
.plate-grid div{display:grid;gap:1px;min-width:0}
.plate-grid small{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.plate-grid b{font-weight:500;font-size:.95rem}

/* ---------- Home ---------- */
.hero{display:grid;gap:20px}
.hero h1{font-size:clamp(2.3rem,1.6rem + 3.4vw,3.6rem);text-transform:uppercase;letter-spacing:.01em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.08rem;max-width:62ch;margin:0;color:var(--muted)}
.progress-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface-2)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--f-mono);font-size:17px}
.rank-name{font-family:var(--f-display);font-size:1.6rem;font-weight:700;text-transform:uppercase}
.tool-tile{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tool-tile:hover{border-color:var(--accent)}
.tool-tile svg{width:26px;height:26px;color:var(--accent)}
.tool-tile b{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.tool-tile span{font-size:.88rem;color:var(--muted);line-height:1.4}
.levels{display:grid;gap:8px}
.level-row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.level-row .n{font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--muted)}
.level-row b{display:block;font-weight:600}
.level-row small{color:var(--muted);font-size:.84rem}
.dossier{display:grid;gap:6px}
.dossier .row{justify-content:space-between}
.status{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.status.afaire{background:var(--amber-soft);color:var(--amber)} .status.encours{background:var(--accent-soft);color:var(--accent)} .status.fait{background:var(--green-soft);color:var(--green)}

/* ---------- Cursus ---------- */
.mod-card{display:grid;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mod-card:hover{border-color:var(--accent)}
.mod-card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mod-card .code{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mod-card h3{font-size:1.35rem}
.mod-card p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.45}
.lesson-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.lesson-list a{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:13px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.lesson-list a:first-child{border-top:0}
.lesson-list a:hover{background:var(--surface-2)}
.lesson-list .c{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.lesson-list .t{font-weight:500;line-height:1.35}
.lesson-list .m{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- Lesson ---------- */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.lesson{max-width:760px;margin:0 auto}
.lesson-head{display:grid;gap:10px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.lesson-head .lead{margin:0;font-size:1.1rem;color:var(--muted);max-width:62ch}
.prose{max-width:68ch}
.prose>*+*{margin-top:1em}
.prose h2{font-size:1.5rem;margin-top:1.7em;padding-top:.2em}
.prose h3{font-size:1.22rem;margin-top:1.4em}
.prose p,.prose ul,.prose ol{margin-bottom:0}
.prose ul,.prose ol{padding-left:1.3em}
.prose li+li{margin-top:.35em}
.prose strong{font-weight:600}
.prose code,.kbd{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:3px}
.prose figure{margin:1.4em 0;display:grid;gap:8px}
.prose figure svg{width:100%;height:auto;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.prose figcaption{font-size:.84rem;color:var(--muted)}
ol.steps{list-style:none;padding:0;counter-reset:st;display:grid;gap:10px}
ol.steps>li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;margin:0}
ol.steps>li::before{content:counter(st);font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.callout{border-radius:var(--r);padding:14px 16px;background:var(--surface-2);display:grid;gap:6px}
.callout>p,.callout>ul{margin:0}
.callout ul{padding-left:1.2em}
.callout-label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.callout.danger{background:var(--red-soft)} .callout.danger .callout-label{color:var(--red)}
.callout.warn{background:var(--amber-soft)} .callout.warn .callout-label{color:var(--amber)}
.callout.tip{background:var(--green-soft)} .callout.tip .callout-label{color:var(--green)}
.callout.w203{background:var(--accent-soft)} .callout.w203 .callout-label{color:var(--accent)}
.callout.info .callout-label{color:var(--muted)}
.src{display:inline-block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;vertical-align:.12em;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.s-wis{color:var(--green)} .s-hay{color:var(--accent)} .s-frm{color:var(--amber)} .s-oem{color:var(--muted)} .s-gen{color:var(--muted)} .s-mb{color:var(--green)}
.s-chk{color:var(--red);border-style:dashed}
.nm{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);padding:1px 6px;border-radius:3px;white-space:nowrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.spec{border-collapse:collapse;width:100%;font-size:.92rem}
table.spec th,table.spec td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.spec thead th{border-top:0;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
table.spec td.v{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.keypoints{border-top:2px solid var(--ink);padding-top:14px;margin-top:28px}
.keypoints ul{margin:8px 0 0;padding-left:1.2em}

.quiz{margin-top:36px;display:grid;gap:14px}
.quiz-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.q-text{margin:0;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.q-x{margin:0;font-size:.92rem;color:var(--muted)}
.quiz-result{padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);font-weight:500}
.lesson-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pager a{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager a small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager a span{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pager a.next{text-align:right}

/* ---------- Diagnostic ---------- */
.tree-card{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tree-card:hover{border-color:var(--accent)}
.tree-card b{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.tree-card span{color:var(--muted);font-size:.9rem;line-height:1.4}
.trail{display:grid;gap:6px;margin-bottom:6px}
.trail div{font-size:.88rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.trail div b{color:var(--ink);font-weight:500}
.ask{font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.2;margin:0}
.answers{display:grid;gap:8px}
.answers button{text-align:left;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;line-height:1.35}
.answers button:hover{border-color:var(--accent);background:var(--accent-soft)}
.verdict{display:grid;gap:14px}
.sev{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:4px}
.sev.stop{background:var(--red-soft);color:var(--red)} .sev.vite{background:var(--amber-soft);color:var(--amber)} .sev.surv{background:var(--green-soft);color:var(--green)}
.causes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.causes li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.prob{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;margin-top:2px}
.prob.h{background:var(--red-soft);color:var(--red)} .prob.m{background:var(--amber-soft);color:var(--amber)} .prob.b{background:var(--surface-2);color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.88rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--surface)}
.links a:hover{border-color:var(--accent)}

/* ---------- Reference ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:thin}
.tabs a{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.9rem;background:var(--surface)}
.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:640px){.filters{grid-template-columns:2fr 1fr}}
.code-item{display:grid;grid-template-columns:minmax(78px,7.2rem) 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.code-item:first-child{border-top:0}
.code-item .k{font-family:var(--f-mono);font-weight:500;color:var(--accent);overflow-wrap:anywhere}
.code-item p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.code-item .t{font-weight:600}
.list-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tool-row{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.tool-row:first-child{border-top:0}
.tool-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.tool-row b{font-weight:600}
.tool-row p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.gl-item{padding:12px 14px;border-top:1px solid var(--line)}
.gl-item:first-child{border-top:0}
.gl-item b{font-weight:600}
.gl-item i{font-style:normal;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:6px}
.gl-item p{margin:3px 0 0;font-size:.92rem}
.calc{display:grid;gap:12px}
.calc-out{font-family:var(--f-mono);font-size:1.05rem;padding:12px 14px;background:var(--surface-2);border-radius:var(--r);font-variant-numeric:tabular-nums}
.leak{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.leak:first-child{border-top:0}
.swatch{width:40px;height:40px;border-radius:50%;border:1px solid var(--line)}

/* ---------- Garage ---------- */
.log-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.log-item:first-child{border-top:0}
.log-item .meta{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.log-item p{margin:3px 0 0;font-size:.92rem}
.plan-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:0}
@media (min-width:700px){.plan-row{grid-template-columns:1.4fr 130px 150px 1fr;align-items:center}}
.plan-row b{font-weight:600}
.plan-row small{display:block;color:var(--muted);font-size:.8rem}
.due{font-family:var(--f-mono);font-size:.82rem}
.due.late{color:var(--red)} .due.soon{color:var(--amber)} .due.ok{color:var(--green)}

/* ---------- Search ---------- */
.search-panel{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.search-bar{display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.search-bar input{flex:1;min-width:0;font-size:1.05rem;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper)}
.search-results{flex:1;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.search-results .inner{max-width:760px;margin:0 auto;display:grid;gap:18px}
.res-group h4{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.res-group a{display:block;padding:10px 12px;border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);margin-top:6px}
.res-group a small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}

/* ---------- Diagram strokes ---------- */
.dg-l{stroke:var(--ink);fill:none;stroke-width:1.6}
.dg-m{stroke:var(--muted);fill:none;stroke-width:1.2}
.dg-a{stroke:var(--accent);fill:none;stroke-width:2.2}
.dg-r{stroke:var(--red);fill:none;stroke-width:2}
.dg-f{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.4}
.dg-fa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.dg-dot{fill:var(--accent)}
.dg-t{fill:var(--ink);font-family:var(--f-mono);font-size:12px}
.dg-ts{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.dg-tb{fill:var(--ink);font-family:var(--f-display);font-size:16px;font-weight:600}
.dg-ta{fill:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:500}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:560px){.brand span{display:none}.icon-btn .lbl{display:none}.icon-btn{padding:8px}}
@media (max-width:400px){.xp-r{display:none}}
.icon-btn{text-decoration:none;color:var(--ink);position:relative}
.icon-btn .lbl{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.acct-dot.ok{background:var(--green)} .acct-dot.off{background:var(--amber)}
@media (max-width:560px){.icon-btn .acct-dot{position:absolute;top:4px;right:4px}}


/* ================= Mouvement, schémas animés, cartes mémoire ================= */
:root{--ease:cubic-bezier(.22,1,.36,1)}

/* Transitions de page (navigateurs compatibles) : seul le contenu bouge, la barre et le rail restent fixes. */
.topbar{view-transition-name:topbar}
.tabbar{view-transition-name:tabbar}
::view-transition-old(root){animation:vt-out .16s ease-in both}
::view-transition-new(root){animation:vt-in .34s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}

/* Cascade d'apparition (part d'un état visible, finit visible). */
.rise{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* En-tête qui s'efface en descendant sur téléphone, barre de lecture. */
.topbar{transition:transform .3s var(--ease)}
.topbar.is-hidden{transform:translateY(-100%)}
.scroll-progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--p,0));z-index:45;pointer-events:none;opacity:0;transition:opacity .3s}
body.reading .scroll-progress{opacity:1}

/* Retours : XP qui vole, compteur qui rebondit, toast, confettis. */
.xp-float{position:fixed;left:0;top:0;z-index:70;pointer-events:none;font-family:var(--f-mono);font-weight:600;font-size:.98rem;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(19,24,30,.18);white-space:nowrap}
.xp-pill{transition:transform .2s}
.xp-pill.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.18)}}
.toast:not([hidden]){animation:toast-in .35s var(--ease)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,12px)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* Micro-interactions. */
.btn{transition:filter .15s,transform .15s}
.btn:active{transform:scale(.97)}
@media (hover:hover){
  .tool-tile,.pager a{transition:transform .25s var(--ease),border-color .2s,box-shadow .25s}
  .tool-tile:hover,.pager a:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .tool-tile svg{transition:transform .3s var(--ease)}
  .tool-tile:hover svg{transform:translateX(3px)}
}
.opt{display:flex;gap:10px;align-items:flex-start;transition:border-color .2s,background-color .2s,transform .15s}
.opt:active:not([disabled]){transform:scale(.985)}
.opt-k{flex:none;width:24px;height:24px;margin-top:-1px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--muted);transition:background-color .2s,color .2s}
.opt:hover:not([disabled]) .opt-k{background:var(--accent);color:var(--on-accent)}
.opt.right .opt-k{background:var(--green);color:var(--surface)}
.opt.wrong .opt-k{background:var(--red);color:var(--surface)}
ol.steps>li{position:relative}
ol.steps>li:not(:last-child)::after{content:"";position:absolute;left:14px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.callout{border-left:3px solid var(--line)}
.callout.danger{border-left-color:var(--red)} .callout.warn{border-left-color:var(--amber)} .callout.tip{border-left-color:var(--green)} .callout.w203{border-left-color:var(--accent)}
.callout-label::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:currentColor;margin-right:7px;vertical-align:1px}

/* Sommaire de leçon. */
.toc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 24px;max-width:68ch}
.toc .eyebrow{width:100%;margin-bottom:2px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.82rem;cursor:pointer;line-height:1.25;text-align:left}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
.prose h2{scroll-margin-top:calc(var(--head-h) + 18px)}

/* Carte du parcours. */
.route{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;margin:6px -4px 10px;padding:6px 4px 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.route-track{display:flex;min-width:max-content}
.node{position:relative;display:grid;justify-items:center;align-content:start;gap:7px;width:88px;text-decoration:none;color:var(--ink)}
.node::before{content:"";position:absolute;top:21px;right:50%;width:100%;height:3px;background:var(--line)}
.node:first-child::before{display:none}
.node.done::before,.node.cur::before{background:var(--accent)}
.dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p,0) * 1%),var(--surface-2) 0)}
.dot b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.node.done .dot b{background:var(--accent);color:var(--on-accent)}
.node.cur .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{from{transform:scale(.88);opacity:.9}to{transform:scale(1.3);opacity:0}}
.node small{font-size:.72rem;line-height:1.2;text-align:center;color:var(--muted);max-width:84px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.cur small{color:var(--ink);font-weight:600}
.node:hover .dot b{outline:2px solid var(--accent);outline-offset:-2px}

/* Jauge d'échéance d'entretien. */
.due-wrap{display:grid;gap:5px;min-width:0}
.pmeter{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pmeter i{display:block;height:100%;background:var(--muted);transform-origin:0 50%;transition:transform .6s var(--ease)}
.pmeter.ok i{background:var(--green)} .pmeter.soon i{background:var(--amber)} .pmeter.late i{background:var(--red)}

/* Cartes mémoire. */
.fc-wrap{max-width:560px;margin:8px auto 0;display:grid;gap:14px}
.fc-meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.fc-box i{display:inline-block;width:18px;height:6px;border-radius:3px;background:var(--surface-2);margin-left:4px}
.fc-box i.on{background:var(--green)}
.fc{position:relative;height:300px;perspective:1200px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .3s var(--ease);border-radius:12px}
.fc.drag{transition:none;cursor:grabbing}
.fc-face{position:absolute;inset:0;border-radius:12px;padding:26px 22px;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .6s var(--ease),border-color .2s,box-shadow .2s;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc-front{background:linear-gradient(160deg,var(--plate-a),var(--plate-b));color:var(--plate-ink)}
.fc-front b{font-family:var(--f-display);font-size:clamp(1.8rem,1.4rem + 2vw,2.5rem);line-height:1.05;font-weight:700}
.fc-front i{font-style:normal;font-size:.95rem;opacity:.8}
.fc-front .eyebrow{color:inherit;opacity:.7}
.fc-hint{position:absolute;bottom:14px;left:0;right:0;font-size:.78rem;opacity:.65}
.fc-back{background:var(--surface);transform:rotateY(180deg)}
.fc-back p{margin:0;font-size:1.04rem;line-height:1.55;max-width:42ch}
.fc.flip .fc-front{transform:rotateY(-180deg)}
.fc.flip .fc-back{transform:rotateY(0)}
.fc[data-swipe="yes"] .fc-face{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.fc[data-swipe="no"] .fc-face{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.fc-in{animation:fc-in .45s var(--ease)}
@keyframes fc-in{from{opacity:0;transform:translateY(16px) scale(.97)}}
.fc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc-actions .btn{min-height:46px;padding-inline:8px}
.fc-help{font-size:.82rem;text-align:center;margin:0}
.fc-stage{overflow-x:clip;padding:4px 8px 10px;margin:-4px -8px -10px}

/* ---------- Schémas animés ---------- */
.viz{container-type:inline-size;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;margin:1.6em 0;box-shadow:var(--shadow)}
.prose>.viz+*{margin-top:1.2em}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz>svg{max-height:380px}
@container (max-width:560px){.viz:not(.kit) .dg-t,.viz:not(.kit) .dg-ts,.viz:not(.kit) .dg-ta{font-size:17px}.viz:not(.kit) .dg-tb{font-size:22px}.viz .bat .dg-ts{font-size:12px}}
.viz.kit .dg-ts{font-size:12.5px}.viz.kit .dg-t,.viz.kit .dg-ta{font-size:13.5px}.viz.kit .dg-tb{font-size:16px}
.viz-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.viz-title{font-family:var(--f-display);font-size:1.3rem;font-weight:600;line-height:1.1}
.viz-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.viz-desc{margin:0;min-height:3.1em;font-size:.95rem}
.viz-note{margin:0;font-size:.78rem;color:var(--muted)}
.vbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;font-size:.85rem;font-weight:600;cursor:pointer;transition:border-color .2s,background-color .2s,color .2s,transform .15s}
.vbtn:hover{border-color:var(--accent)}
.vbtn:active{transform:scale(.96)}
.vbtn[data-k="steer"][aria-pressed="true"],.vbtn[data-k="cmd"][aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vtoggle{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:.85rem;cursor:pointer}
.vtoggle input{position:absolute;opacity:0;width:1px;height:1px}
.vtrack{position:relative;flex:none;width:38px;height:22px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);transition:background-color .2s,border-color .2s}
.vtrack::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .25s var(--ease),background-color .2s}
.vtoggle input:checked+.vtrack{background:var(--red-soft);border-color:var(--red)}
.vtoggle input:checked+.vtrack::after{transform:translateX(16px);background:var(--red)}
.vtoggle input:focus-visible+.vtrack{outline:2px solid var(--accent);outline-offset:2px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vchip{font-family:var(--f-mono);font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);transition:background-color .2s,color .2s}
.vchip.on{background:var(--accent);color:var(--on-accent)}
.vsep{color:var(--muted);font-size:.8rem}
.viz-read{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.read{background:var(--surface-2);border-radius:var(--r);padding:8px 12px;display:grid;gap:2px;min-width:0}
.read small{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.read b{font-family:var(--f-display);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.viz .good{color:var(--green)} .viz .warn{color:var(--amber)} .viz .bad{color:var(--red)}
.vrange{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.vrange input{width:100%;accent-color:var(--accent);min-height:32px}
.vrange span{min-width:7ch;text-align:right}
@container (max-width:480px){.vrange{grid-template-columns:1fr auto}.vrange label{grid-column:1/-1}}
.vmeter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.vmeter i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(.2);transition:transform .15s linear}
.tmeter,.tgauge{position:relative;height:34px}
.tmeter::before,.tgauge::before{content:"";position:absolute;left:0;right:0;top:6px;height:8px;border-radius:99px;opacity:.45}

<h2>Les points de levage de la W203</h2>
<p>La W203 a quatre points de levage sur le bas de caisse : derrière chaque roue avant et devant chaque roue arrière, là où s’engage le cric de bord ${s('gen')}. Ce sont des zones renforcées. Avec un cric rouleur, centre le tampon sur le point. Ne lève jamais par le carter d’huile, le carter de boîte, un bras de suspension en aluminium, le réservoir ou une ligne d’échappement.</p>
${w203(`<p>Sur une W203 de 2001, ces points rouillent et leurs caches plastique cassent. Inspecte-les avant de lever : un point mangé par la rouille peut céder. Si c’est le cas, lève par une zone structurelle désignée dans WIS et fais réparer le point ${s('chk')}.</p>`)}
<h2>La procédure</h2>
${steps([
  'Voiture sur sol plat, boîte en P (ou 1re en manuelle), frein de stationnement serré.',
  'Cale les roues qui restent au sol, du côté opposé à celui que tu lèves.',
  'Positionne le cric sur le point de levage, lève doucement en surveillant que le tampon reste centré.',
  'Glisse la chandelle sous une zone structurelle prévue (bas de caisse renforcé, à côté du point de levage si le cric l’occupe), règle-la à la bonne hauteur.',
  'Redescends lentement le cric jusqu’à ce que la voiture repose sur la chandelle. Laisse le cric au contact, sans charge, en sécurité.',
  'Fais le « test de poussée » : secoue franchement la voiture. Si elle bouge sur ses appuis, redescends tout et recommence.',
  'Glisse la roue démontée sous le bas de caisse : si tout lâche, la voiture tombe sur la roue et pas sur toi.'
])}
<h2>Les rampes</h2>
<p>Pour une vidange, des rampes de qualité sont plus stables qu’un cric. Monte lentement, frein de stationnement serré, cales derrière les roues arrière. Vérifie que le bas du bouclier passe : la W203 est assez basse, des rampes à pente douce évitent d’abîmer le spoiler.</p>
${key(['Cric pour lever, chandelles pour tenir.', 'Points de levage inspectés avant usage.', 'Test de poussée systématique.', 'Roue sous le bas de caisse.'])}`,
    quiz: [
      { q: 'Quel est le rôle du cric une fois la voiture posée sur chandelles ?', o: ['Il porte la voiture avec les chandelles', 'Il reste au contact sans charge, en sécurité', 'Il est retiré pour faire de la place'], a: 1, x: 'Les chandelles portent la charge. Le cric reste au contact comme sécurité.' },
      { q: 'Où ne faut-il jamais lever une W203 ?', o: ['Au point de levage du bas de caisse', 'Sous le carter d’huile', 'Avec un tampon caoutchouc'], a: 1, x: 'Le carter d’huile n’est pas une pièce structurelle : il se déforme ou se fend.' },
      { q: 'À quoi sert la roue glissée sous le bas de caisse ?', o: ['À caler la voiture', 'À amortir une chute de la voiture si un appui lâche', 'À ne pas la perdre'], a: 1, x: 'C’est une sécurité de dernier recours.' }
    ] },
  { id: 'batterie-securite', title: 'Batterie, électricité & airbags', min: 8,
    lead: 'Couper le courant dans le bon ordre protège les modules électroniques, et toi.',
    body: `
<h2>Où est la batterie</h2>
<p>Sur la W203 essence, la batterie est dans le compartiment moteur, côté droit, près du tablier, sous un cache ${s('frm')}. Repère la borne négative (–) avant de commencer.</p>
<h2>Débrancher et rebrancher</h2>
${steps([

${info(`<p>Pourquoi le négatif d’abord ? Toute la carrosserie est reliée au négatif. Si ta clé touche la carrosserie pendant que tu desserres le positif branché, tu fais un court-circuit franc. En commençant par le négatif, ce risque disparaît.</p>`)}
<h2>Après rebranchement</h2>
<ul>
<li><strong>Vitres à commande impulsionnelle</strong> : elles peuvent perdre leur fonction « un appui ». Ferme chaque vitre à fond et maintiens le bouton en position fermeture environ une seconde ${s('chk')}. Même principe pour le toit ouvrant.</li>
<li><strong>ESP</strong> : un message peut apparaître le temps que le capteur d’angle de volant se recale. Quelques braquages et quelques mètres de roulage suffisent en général ${s('chk')}.</li>
<li>Heure, stations radio, éventuellement code autoradio selon l’équipement.</li>
</ul>
<h2>Airbags et prétensionneurs</h2>
${danger(`<ul><li>Ne mesure jamais un airbag ou son connecteur à l’ohmmètre : le courant de mesure peut le déclencher.</li><li>Avant toute intervention sur le volant, la colonne, les sièges ou les montants : batterie débranchée et attente de plusieurs minutes.</li><li>Les connecteurs d’airbag sont en général jaunes. Ne les touche pas sans la procédure WIS.</li></ul>`)}
<h2>La batterie elle-même</h2>
<ul>
<li>Elle dégage de l’hydrogène en charge : pas d’étincelle ni de flamme à proximité.</li>
<li>Retire bague et montre : un court-circuit à travers un anneau métallique brûle profondément.</li>
<li>Acide = lunettes. En cas de contact, rinçage abondant à l’eau.</li>
</ul>
${key(['Débrancher : négatif d’abord. Rebrancher : positif d’abord.', 'Réinitialiser vitres et toit après coupure.', 'Jamais d’ohmmètre sur un airbag.'])}`,
    quiz: [
      { q: 'Dans quel ordre débranches-tu la batterie ?', o: ['Positive puis négative', 'Négative puis positive', 'Peu importe'], a: 1, x: 'Négatif d’abord : la carrosserie étant au négatif, aucun court-circuit possible ensuite.' },
      { q: 'Après une coupure batterie, une vitre ne remonte plus d’un seul appui. Cause la plus probable ?', o: ['Moteur de vitre HS', 'Fin de course à réinitialiser', 'Fusible grillé'], a: 1, x: 'La position de fin de course est perdue : on la réapprend en maintenant le bouton en butée.' }

  { id: 'fluides-securite', title: 'Chaleur, fluides & incendie', min: 7,
    lead: 'Brûlures, projections et vapeurs causent plus d’accidents au garage que les chutes de voiture.',
    body: `
<h2>Ce qui brûle</h2>
<ul>
<li><strong>Circuit de refroidissement</strong> : sous pression à chaud. N’ouvre jamais le bouchon du vase moteur chaud. Attends qu’il soit froid au toucher, puis ouvre d’un quart de tour avec un chiffon pour laisser sortir la pression.</li>
<li><strong>Échappement et catalyseurs</strong> : plusieurs centaines de degrés après un trajet. Laisse refroidir au moins une heure avant de travailler dessous.</li>
<li><strong>ATF</strong> : le contrôle de niveau de la 722.6 se fait vers 80 °C. Gants obligatoires.</li>
</ul>
${warn(`<p>Le ventilateur électrique du radiateur peut se mettre en marche moteur coupé, juste après un trajet. Garde les doigts et les chiffons loin des pales tant que le moteur est chaud.</p>`)}
<h2>Carburant</h2>
<ul>
<li>Pas de lampe à incandescence ni de cigarette. Une lampe LED et un extincteur à portée de main (poudre ABC ou CO₂).</li>
<li>Avant d’ouvrir un circuit d’essence : enlève le fusible ou le relais de pompe, démarre et laisse caler pour faire baisser la pression, puis enveloppe le raccord d’un chiffon.</li>
<li>Jamais de travail sur l’essence dans un garage fermé sans ventilation.</li>
</ul>
<h2>Produits chimiques</h2>
<ul>
<li><strong>Liquide de frein</strong> : attaque la peinture en quelques minutes et irrite la peau. Rince immédiatement à l’eau.</li>
<li><strong>Huile usagée</strong> : nocive par contact prolongé. Gants nitrile.</li>
<li><strong>Liquide de refroidissement</strong> : toxique et sucré, attirant pour les animaux. Essuie chaque goutte.</li>
</ul>
<h2>Déchets</h2>
<p>Huile usagée, filtres, liquide de refroidissement, liquide de frein et batteries vont en déchetterie ou dans les points de collecte des centres auto. Jamais à l’égout ni à la poubelle.</p>
<h2>Équipement de protection</h2>
<p>Lunettes dès que tu es sous la voiture (rouille et saletés tombent dans les yeux), gants nitrile, chaussures fermées, et un tapis ou une planche à roulettes pour ne pas t’allonger sur un sol froid et sale.</p>
${key(['Vase de refroidissement : froid seulement.', 'Ventilateur : peut démarrer moteur coupé.', 'Essence : dépressuriser, ventiler, extincteur.', 'Tous les fluides usagés en collecte.'])}`,

      { q: 'Une goutte de liquide de frein tombe sur l’aile. Tu…', o: ['La laisses sécher', 'Rinces à l’eau tout de suite', 'Frottes au chiffon sec'], a: 1, x: 'Il attaque le vernis : l’eau le dilue et l’emporte.' }
    ] }
  ] });

/* =================== M02 — Fondamentaux mécaniques =================== */
W.mod({ id: 'meca', num: 2, code: 'M02', level: 1, title: 'Fondamentaux mécaniques',
  desc: 'Comment marche un moteur, comment la puissance arrive aux roues, comment la voiture freine et tourne.',
  lessons: [
  { id: 'quatre-temps', title: 'Le moteur 4 temps', min: 10,
    lead: 'Tout ce qui suit repose sur ce cycle. Prends le temps de le visualiser.',
    body: `
<div data-viz="temps"></div>
<ol>
<li><strong>Admission</strong> : le piston descend, la soupape d’admission est ouverte, le cylindre aspire l’air (et l’essence injectée dans la tubulure).</li>
<li><strong>Compression</strong> : soupapes fermées, le piston remonte et comprime le mélange.</li>
<li><strong>Combustion-détente</strong> : les bougies allument le mélange juste avant le point mort haut. La pression repousse le piston : c’est le seul temps moteur.</li>
<li><strong>Échappement</strong> : la soupape d’échappement s’ouvre, le piston remonte et chasse les gaz brûlés.</li>
</ol>
<h2>Le vocabulaire</h2>
<ul>
<li><strong>PMH / PMB</strong> : point mort haut et point mort bas, les deux positions extrêmes du piston.</li>
<li><strong>Alésage</strong> : diamètre du cylindre. <strong>Course</strong> : distance PMH-PMB.</li>
<li><strong>Taux de compression</strong> : rapport entre le volume au PMB et au PMH. Le M112 de ta C 240 est à 10,5:1 ${s('mb')}.</li>
</ul>
<h2>Calcule la cylindrée de ton moteur</h2>
<p>Cylindrée = π/4 × alésage² × course × nombre de cylindres. Avec l’alésage de 89,9 mm et la course de 68,2 mm du M112.912 ${s('mb')} :</p>
<p class="mono">0,7854 × 8,99² × 6,82 × 6 ≈ 2 597 cm³</p>
<p>C’est exactement la cylindrée officielle. Le moteur est dit « super-carré » : son alésage est plus grand que sa course, ce qui favorise les hauts régimes.</p>
<h2>Couple et puissance</h2>
<p>Le couple est la force de rotation (en N·m), la puissance est ce couple multiplié par la vitesse de rotation. La formule utile : <span class="mono">P (kW) = C (N·m) × régime (tr/min) ÷ 9 549</span>.</p>
<p>Ton M112 donne 240 N·m à 4 500 tr/min et 125 kW (170 ch) à 5 500 tr/min ${s('mb')}. À 5 500 tr/min, le couple est donc d’environ 125 × 9 549 ÷ 5 500 ≈ 217 N·m : il a déjà commencé à baisser, mais le régime plus élevé fait monter la puissance.</p>
${key(['Un seul temps moteur sur quatre.', 'Deux tours de vilebrequin par cycle.', 'M112.912 : 89,9 × 68,2 mm, 2 597 cm³, 10,5:1.', 'P = C × régime ÷ 9 549.'])}`,
    quiz: [
      { q: 'Combien de tours fait le vilebrequin pour un cycle complet ?', o: ['1', '2', '4'], a: 1, x: 'Deux tours de vilebrequin, un tour d’arbre à cames.' },
      { q: 'Pendant quel temps les deux soupapes sont-elles fermées et le piston remonte ?', o: ['Admission', 'Compression', 'Échappement'], a: 1, x: 'La compression se fait soupapes fermées.' },
      { q: 'Un moteur donne 200 N·m à 3 000 tr/min. Quelle puissance ?', o: ['≈ 63 kW', '≈ 120 kW', '≈ 20 kW'], a: 0, x: '200 × 3 000 ÷ 9 549 ≈ 62,8 kW.' }
    ] },
  { id: 'triangle', title: 'Air, carburant, étincelle, compression', min: 8,
    lead: 'Un moteur qui ne démarre pas manque toujours d’au moins un de ces quatre ingrédients.',
    body: `
<h2>Les quatre conditions</h2>
<p>Pour tourner, un moteur à essence a besoin de : <strong>air</strong> en quantité connue, <strong>carburant</strong> dosé, <strong>étincelle</strong> au bon moment, et <strong>compression</strong> suffisante. Ajoute la synchronisation (calage de distribution et information de position du vilebrequin pour le calculateur).</p>
<h2>Le mélange</h2>
<p>La combustion idéale de l’essence se fait à environ 14,7 kg d’air pour 1 kg d’essence : c’est la stœchiométrie, notée λ = 1 ${s('gen')}.</p>
<ul>
<li>λ &lt; 1 : mélange <strong>riche</strong> (trop d’essence). Fumée noire, odeur d’essence, bougies noires, consommation élevée.</li>
<li>λ &gt; 1 : mélange <strong>pauvre</strong> (trop d’air). Ralenti instable, trous à l’accélération, risque de cliquetis et de surchauffe des soupapes.</li>
</ul>
<p>Le calculateur règle le mélange en continu grâce aux sondes lambda : c’est la régulation en boucle fermée.</p>
<h2>Les causes typiques par ingrédient</h2>
${table(['Ingrédient', 'Ce qui le supprime', 'Comment le vérifier'], [
  ['Air', 'Filtre bouché (rare), papillon bloqué, prise d’air non mesurée (trop d’air)', 'Inspection, données du débitmètre'],
  ['Carburant', 'Pompe, relais, fusible, filtre, réservoir vide (jauge fausse)', 'Écouter la pompe au contact, pression d’essence'],
  ['Étincelle', 'Bobine, bougies, capteur de vilebrequin, calculateur', 'Testeur d’étincelle, régime au démarreur'],
  ['Compression', 'Distribution sautée, soupape brûlée, joint de culasse', 'Test de compression']
])}
${tip(`<p>Sur un moteur moderne, le calculateur ne commande ni injection ni allumage s’il ne reçoit pas le signal du capteur de vilebrequin. Si l’aiguille du compte-tours reste à zéro pendant que le démarreur tourne, pense à ce capteur.</p>`)}
${key(['Air + carburant + étincelle + compression, synchronisés.', 'λ = 1 ≈ 14,7:1.', 'Riche : fumée noire. Pauvre : ratés, ralenti instable.'])}`,
    quiz: [
      { q: 'Un mélange pauvre signifie…', o: ['Trop d’essence', 'Trop d’air', 'Pas assez de compression'], a: 1, x: 'Pauvre = trop d’air pour l’essence injectée (λ > 1).' },
      { q: 'Le démarreur tourne, le compte-tours reste à zéro et le moteur ne démarre pas. Piste prioritaire ?', o: ['Bougies', 'Capteur de vilebrequin', 'Filtre à air'], a: 1, x: 'Sans signal de régime, le calculateur n’allume ni n’injecte.' }
    ] },
  { id: 'lubri-refroid', title: 'Lubrification & refroidissement', min: 9,
    lead: 'L’huile et le liquide de refroidissement sont la circulation sanguine du moteur.',
    body: `
<h2>L’huile</h2>
<p>Elle lubrifie, refroidit les pièces que l’eau n’atteint pas (pistons, paliers), nettoie et transporte les impuretés vers le filtre. Une pompe entraînée par le moteur la met sous pression ; un filtre la nettoie ; le carter la stocke.</p>
<h3>Lire une viscosité : 5W-40</h3>
<ul>
<li><strong>5W</strong> : comportement à froid (W = winter). Plus le chiffre est bas, plus l’huile circule vite au démarrage à froid.</li>
<li><strong>40</strong> : viscosité à chaud (100 °C). Plus il est haut, plus le film d’huile reste épais à chaud.</li>
</ul>
<p>La viscosité ne suffit pas : chez Mercedes, l’huile doit porter une <strong>homologation</strong> (par exemple MB 229.3 ou 229.5). Voir le module Fluides.</p>
<h2>Le refroidissement</h2>
<ul>
<li><strong>Pompe à eau</strong> : entraînée par la courroie, elle fait circuler le liquide.</li>
<li><strong>Thermostat</strong> : vanne qui reste fermée à froid (le moteur chauffe vite), puis s’ouvre pour envoyer le liquide au radiateur.</li>
<li><strong>Radiateur + ventilateur électrique</strong> : évacuent la chaleur. Le ventilateur se déclenche selon la température et la clim.</li>
<li><strong>Vase d’expansion et bouchon</strong> : le circuit est pressurisé, ce qui fait monter le point d’ébullition au-dessus de 100 °C.</li>
<li><strong>Radiateur de chauffage</strong> : le chauffage de l’habitacle récupère la chaleur du moteur.</li>
</ul>
<div data-viz="refroidissement"></div>
${w203(`<p>Sur la W203, le thermostat qui reste ouvert est très fréquent : le moteur peine à dépasser 80 °C, le chauffage tiédit, la consommation monte et le code P0128 peut apparaître ${s('frm')}. Voir la leçon « Thermostat, pompe à eau, ventilateur ».</p>`)}
${key(['5W-40 : 5 à froid, 40 à chaud.', 'Homologation MB obligatoire, pas seulement la viscosité.', 'Thermostat : fermé à froid, ouvert à chaud.', 'Circuit pressurisé = point d’ébullition plus haut.'])}`,
    quiz: [
      { q: 'Dans « 0W-40 », que représente 0W ?', o: ['La viscosité à chaud', 'Le comportement à froid', 'La norme Mercedes'], a: 1, x: 'Le chiffre devant W décrit la fluidité à froid.' },
      { q: 'Le moteur reste à 70 °C sur autoroute en hiver. Suspect n°1 ?', o: ['Pompe à eau', 'Thermostat bloqué ouvert', 'Radiateur bouché'], a: 1, x: 'Un thermostat ouvert en permanence empêche le moteur de chauffer.' }
    ] },
  { id: 'moteur-roues', title: 'Du moteur aux roues', min: 8,
    lead: 'Ta C 240 est une propulsion : le moteur entraîne les roues arrière.',
    body: `
<h2>La chaîne de transmission</h2>
${steps([
  '<strong>Moteur</strong> longitudinal à l’avant.',
  '<strong>Boîte de vitesses</strong> : automatique 5 rapports 722.6 (« 5G-Tronic ») ou manuelle 6 rapports selon la voiture. La boîte auto contient un <strong>convertisseur de couple</strong> à la place d’un embrayage.',
  '<strong>Arbre de transmission</strong> en deux parties avec un palier central et des <strong>flectors</strong> (disques flexibles en caoutchouc) qui absorbent les à-coups.',
  '<strong>Pont arrière</strong> avec <strong>différentiel</strong> : il renvoie le mouvement à 90° et laisse les roues tourner à des vitesses différentes en virage.',
  '<strong>Arbres de roue</strong> (cardans) vers les moyeux arrière.'
])}
<h2>Le convertisseur de couple</h2>
<p>Deux turbines face à face dans de l’huile : la première, liée au moteur, projette l’ATF sur la seconde, liée à la boîte. Il y a toujours un peu de glissement, d’où une perte. Pour l’éviter à vitesse stabilisée, un <strong>embrayage de pontage</strong> solidarise les deux turbines.</p>
${info(`<p>Identification : les C 240 4MATIC (transmission intégrale) sont des 203.081 ${s('chk')}. Ta 203.061 est une propulsion simple, sans boîte de transfert.</p>`)}
${key(['C 240 203.061 = propulsion.', 'Boîte auto 722.6 : convertisseur + embrayage de pontage.', 'Flectors et palier central sur l’arbre.'])}`,
    quiz: [
      { q: 'Quel organe laisse les roues arrière tourner à des vitesses différentes en virage ?', o: ['Le convertisseur', 'Le différentiel', 'Le flector'], a: 1, x: 'Le différentiel répartit le couple tout en autorisant une différence de vitesse.' },
      { q: 'À quoi sert l’embrayage de pontage ?', o: ['À changer de rapport', 'À supprimer le glissement du convertisseur à vitesse stable', 'À démarrer en côte'], a: 1, x: 'Il verrouille le convertisseur pour réduire pertes et consommation.' }
    ] },
  { id: 'freiner-diriger', title: 'Freiner, diriger, suspendre', min: 10,
    lead: 'Les trois systèmes qui gardent la voiture sur la route. Ce sont aussi les plus contrôlés au contrôle technique.',
    body: `
<h2>Le freinage hydraulique</h2>
<p>Le principe de Pascal : une pression appliquée sur un liquide se transmet partout. La pédale pousse le maître-cylindre, le liquide pousse les pistons d’étrier, les plaquettes serrent le disque. Le <strong>servofrein</strong> (à dépression) multiplie l’effort de ton pied.</p>
<p>Le liquide de frein absorbe l’humidité de l’air : son point d’ébullition baisse avec les années. À chaud, des bulles de vapeur se forment et la pédale devient molle. D’où le remplacement tous les deux ans.</p>
<p><strong>ABS</strong> : empêche le blocage des roues. <strong>ESP</strong> : freine une roue à la fois pour corriger une glissade. <strong>BAS</strong> : détecte un freinage d’urgence et donne toute la pression.</p>
<h2>La direction</h2>
<p>Ta W203 a une crémaillère à assistance hydraulique : une pompe entraînée par la courroie envoie de l’huile sous pression qui aide la crémaillère à se déplacer quand tu tournes le volant. Le module Direction détaille tout, y compris les fuites.</p>
<h2>La suspension</h2>
<ul>
<li><strong>Ressort</strong> : porte la voiture.</li>
<li><strong>Amortisseur</strong> : freine les oscillations du ressort. Sans lui, la voiture rebondit.</li>
<li><strong>Barre stabilisatrice</strong> : limite le roulis en virage, reliée aux roues par des biellettes.</li>
<li><strong>Silentblocs et rotules</strong> : articulations en caoutchouc et à billes. Ce sont elles qui s’usent et font du bruit.</li>
</ul>
<h2>La géométrie</h2>
<ul>
<li><strong>Parallélisme</strong> : orientation des roues vues de dessus. Un mauvais réglage use l’intérieur ou l’extérieur des pneus.</li>
<li><strong>Carrossage</strong> : inclinaison des roues vues de face.</li>
<li><strong>Chasse</strong> : inclinaison de l’axe de pivot. Elle ramène le volant au centre.</li>
</ul>
<p>Après tout remplacement de biellette de direction, de bras ou de berceau : contrôle de géométrie en atelier.</p>
${key(['Frein = hydraulique + servofrein à dépression.', 'Liquide de frein : hygroscopique, 2 ans.', 'Ressort porte, amortisseur freine.', 'Pièces touchées sur le train = géométrie à refaire.'])}`,
    quiz: [

      { q: 'Quelle pièce empêche la voiture de rebondir après une bosse ?', o: ['Le ressort', 'L’amortisseur', 'La barre stabilisatrice'], a: 1, x: 'L’amortisseur dissipe l’énergie du ressort.' }
    ] }

<h2>L’analogie de l’eau</h2>
<ul>

<h2>La loi d’Ohm</h2>
<p class="mono">U = R × I &nbsp;·&nbsp; P = U × I</p>
<p>Exemple : une ampoule de 55 W sous 12 V consomme 55 ÷ 12 ≈ 4,6 A. Un ventilateur de radiateur peut en consommer bien plus : c’est pourquoi il a un fusible de forte intensité.</p>
<h2>Un circuit, c’est une boucle</h2>
<p>Le courant part du + de la batterie, passe par un fusible, un interrupteur ou un relais, le consommateur, puis revient au – par la <strong>masse</strong> (la carrosserie et le bloc moteur). Une masse mal serrée coupe le circuit aussi sûrement qu’un fil coupé.</p>

<p>Le chiffre qui suit : <strong>0</strong> = code générique normalisé, <strong>1</strong> = code propre au constructeur ${s('gen')}. Un P0 se lit avec n’importe quel lecteur OBD ; les codes Mercedes des autres calculateurs demandent un outil à couverture Mercedes.</p>
<h2>Ce que dit vraiment un code</h2>
<p><span class="mono">P0101</span> « débitmètre, plage ou performance » ne veut pas dire « débitmètre HS ». Une prise d’air après le débitmètre ou un soufflet fendu donnent exactement ce code. Le code te dit <strong>où regarder</strong>, le test te dit <strong>quoi changer</strong>.</p>
<h2>Les états d’un code</h2>
<ul>
<li><strong>En attente</strong> : détecté une fois, pas encore confirmé.</li>
<li><strong>Confirmé / actif</strong> : présent maintenant, voyant allumé.</li>

${table(['Module', 'Emplacement', 'Commande notamment'], [

<ul>
<li>Plusieurs fonctions sans rapport entre elles qui lâchent en même temps, toutes gérées par le même SAM.</li>
<li>Messages de défaut d’ampoule alors que l’ampoule est bonne, essuie-glaces qui s’emballent.</li>
<li>Traces d’eau ou de corrosion verte sur ses connecteurs.</li>
</ul>
<h2>L’eau, ennemi n°1</h2>
<p>Le SAM avant est sous le capot, près de la baie de pare-brise. Si les évacuations de cette baie sont bouchées par des feuilles, l’eau monte et peut atteindre le module ou ses connecteurs. Voir « Eau dans l’habitacle & drains ».</p>
${warn(`<p>Remplacer un SAM : un module d’occasion de même référence peut demander un codage pour que toutes les fonctions marchent ${s('frm')}. Avant de remplacer, sèche, nettoie les connecteurs et vérifie les fusibles et les masses.</p>`)}
${key(['SAM = fusibles + relais + calculateur.', 'Fonctions groupées en panne = SAM ou son alimentation.', 'Eau dans la baie = danger pour le SAM avant.'])}`,

      { q: 'Phare, essuie-glace et avertisseur lâchent ensemble. Où regardes-tu ?', o: ['SAM avant et son alimentation', 'Calculateur moteur', 'SAM arrière'], a: 0, x: 'Ces fonctions dépendent du SAM avant.' }
    ] },

<p>Voiture fermée et endormie, la consommation doit tomber très bas, de l’ordre de quelques dizaines de milliampères ${s('gen')} ${s('chk')}. Au-delà, quelque chose reste éveillé.</p>
<h2>La méthode</h2>
${steps([

${tip(`<p>Tirer les fusibles un par un réveille souvent les calculateurs et fausse la mesure. La méthode de la tension aux bornes des fusibles évite ce piège.</p>`)}

/* Schémas animés et interactifs de l'Académie W203. Code original, aucune dépendance. */
window.Viz = (function () {
  'use strict';
  const RM = matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => RM.matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const f1 = (v) => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
  const S = (k) => window.W203.h.s(k);
  let uid = 0;

  /* Boucle d'animation : en pause hors écran, arrêtée quand l'élément quitte la page. */
  function loop(el, step, autoplay) {
    let raf = 0, vis = true, on = !!autoplay && !reduced(), last = 0;
    const tick = (now) => {
      raf = 0;
      if (!el.isConnected) { io.disconnect(); return; }
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now;
      step(dt);
      if (on && vis) raf = requestAnimationFrame(tick); else last = 0;
    };
    const kick = () => { if (!raf && on && vis) raf = requestAnimationFrame(tick); };
    const io = new IntersectionObserver((es) => { vis = es[0].isIntersecting; kick(); });
    io.observe(el); step(0); kick();
    return { play() { on = true; kick(); }, pause() { on = false; }, get on() { return on; } };
  }
  const head = (title, ctrl) => `<div class="viz-head"><div><p class="eyebrow">Schéma animé</p><div class="viz-title">${title}</div></div><div class="viz-ctrl">${ctrl || ''}</div></div>`;
  const note = (t) => `<p class="viz-note">${t}</p>`;
  const playBtn = '<button class="vbtn" type="button" data-k="play">Pause</button>';
  function bindPlay(el, lp) {
    const b = el.querySelector('[data-k="play"]'); if (!b) return;
    const sync = () => { b.textContent = lp.on ? 'Pause' : 'Lecture'; b.setAttribute('aria-pressed', lp.on ? 'false' : 'true'); };
    b.addEventListener('click', () => { lp.on ? lp.pause() : lp.play(); sync(); }); sync();
  }
  const toggle = (id, label, on) => `<label class="vtoggle" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}><span class="vtrack" aria-hidden="true"></span>${label}</label>`;

  const V = {};

  /* ---------------- 1. Le cycle à quatre temps ---------------- */
  V.temps = {
    title: 'Le cycle à quatre temps', lessons: ['quatre-temps'],
    html() {
      const ph = ['Admission', 'Compression', 'Combustion', 'Échappement'];
      return head(this.title, playBtn + '<button class="vbtn" type="button" data-k="next">Temps suivant</button>') +
      `<div class="vchips">${ph.map((t, i) => `<span class="vchip" data-ph="${i}">${i + 1} · ${t}</span>`).join('')}</div>
      <svg viewBox="0 0 360 304" role="img" aria-label="Piston, soupapes et vilebrequin animés">
        <path class="flow c-cold flow-in" d="M30 49 H100"/><path class="flow c-air flow-ex" d="M260 49 H330"/>
        <rect class="gas" x="112" y="60" width="136" height="50"/>
        <path class="dg-l" d="M110 60 V238 M250 60 V238" stroke-width="3"/>
        <rect class="dg-f" x="96" y="38" width="168" height="22" rx="3"/>
        <g class="valve-in"><line class="dg-l" x1="140" y1="20" x2="140" y2="60"/><line class="dg-l" x1="126" y1="61" x2="154" y2="61" stroke-width="5"/></g>
        <g class="valve-ex"><line class="dg-l" x1="220" y1="20" x2="220" y2="60"/><line class="dg-l" x1="206" y1="61" x2="234" y2="61" stroke-width="5"/></g>
        <rect class="dg-f" x="175" y="12" width="10" height="30" rx="2"/>
        <circle class="spark" cx="180" cy="68" r="8"/>
        <line class="dg-l rod" x1="180" y1="120" x2="180" y2="228" stroke-width="5"/>
        <g class="piston"><rect class="dg-fa" x="114" y="0" width="132" height="36" rx="3"/><line class="dg-m" x1="114" y1="9" x2="246" y2="9"/><line class="dg-m" x1="114" y1="16" x2="246" y2="16"/><circle class="dg-dot" cx="180" cy="14" r="4"/></g>
        <circle class="dg-m" cx="180" cy="262" r="34"/><circle class="dg-dot crankpin" cx="180" cy="228" r="6"/>
        <text class="dg-ts" x="30" y="40">admission</text><text class="dg-ts" x="330" y="40" text-anchor="end">échappement</text>
        <text class="dg-t ang" x="350" y="298" text-anchor="end">0°</text><text class="dg-ts" x="10" y="298">vilebrequin</text>
      </svg>
      <p class="viz-desc" data-desc></p>${note('Schéma de principe. Un cycle complet = 720° de vilebrequin, soit deux tours. ' + S('gen'))}`;
    },
    init(el) {
      const q = (s) => el.querySelector(s);
      const piston = q('.piston'), rod = q('.rod'), pin = q('.crankpin'), gas = q('.gas'), vin = q('.valve-in'), vex = q('.valve-ex'), spark = q('.spark'), fin = q('.flow-in'), fex = q('.flow-ex'), ang = q('.ang'), desc = q('[data-desc]');
      const chips = [...el.querySelectorAll('.vchip')];
      const D = ['Le piston descend, la soupape d’admission est ouverte : le cylindre aspire l’air et l’essence.', 'Soupapes fermées, le piston remonte et comprime le mélange.', 'Les deux bougies allument le mélange : la pression repousse le piston. C’est le seul temps moteur.', 'La soupape d’échappement s’ouvre, le piston remonte et chasse les gaz brûlés.'];
      const r = 34, l = 104, cx = 180, cy = 262; let th = 0;
      const draw = () => {
        const t = (th * Math.PI) / 180, sx = r * Math.sin(t), cc = r * Math.cos(t);
        const pinY = cy - (cc + Math.sqrt(l * l - sx * sx)), top = pinY - 14, ph = Math.floor((th % 720) / 180);
        piston.setAttribute('transform', `translate(0 ${top.toFixed(1)})`);
        rod.setAttribute('y1', pinY.toFixed(1)); rod.setAttribute('x2', (cx + sx).toFixed(1)); rod.setAttribute('y2', (cy - cc).toFixed(1));
        pin.setAttribute('cx', (cx + sx).toFixed(1)); pin.setAttribute('cy', (cy - cc).toFixed(1));
        gas.setAttribute('height', Math.max(0, top - 60).toFixed(1));
        gas.setAttribute('class', 'gas ' + ['g-in', 'g-comp', 'g-burn', 'g-ex'][ph]);
        gas.style.opacity = ph === 2 ? (0.75 - 0.5 * ((th - 360) / 180)).toFixed(2) : '';
        const li = ph === 0 ? Math.sin((Math.PI * th) / 180) : 0, le = ph === 3 ? Math.sin((Math.PI * (th - 540)) / 180) : 0;
        vin.setAttribute('transform', `translate(0 ${(li * 14).toFixed(1)})`); vex.setAttribute('transform', `translate(0 ${(le * 14).toFixed(1)})`);
        const s = th > 340 && th < 380 ? 1 - Math.abs(th - 360) / 20 : 0;
        spark.style.opacity = s.toFixed(2); spark.setAttribute('r', (6 + s * 12).toFixed(1));
        fin.classList.toggle('off', ph !== 0); fex.classList.toggle('off', ph !== 3);
        ang.textContent = Math.round(th % 720) + '°';
        chips.forEach((c, i) => c.classList.toggle('on', i === ph));
        if (desc._ph !== ph) { desc.textContent = D[ph]; desc._ph = ph; }
      };
      const lp = loop(el, (dt) => { th = (th + 160 * dt) % 720; draw(); }, true);
      bindPlay(el, lp);
      q('[data-k="next"]').addEventListener('click', () => { lp.pause(); el.querySelector('[data-k="play"]').textContent = 'Lecture'; th = ((Math.floor(th / 180) + 1) * 180 + 90) % 720; draw(); });
    }
  };

  /* ---------------- 2. Ordre d'allumage du V6 ---------------- */
  V.allumage = {

    init(el) {

        const o = open();
        q('.p-c').classList.toggle('off', o < 0.05); q('.p-d').classList.toggle('off', o < 0.05);

          : o < 0.05 ? 'Moteur froid : le thermostat est fermé, le liquide tourne en petit circuit par la dérivation et le chauffage. Le moteur monte vite en température.'
          : fan ? 'À l’arrêt ou par forte chaleur, le ventilateur électrique prend le relais pour refroidir le radiateur.' : 'Le thermostat s’ouvre progressivement et dose le passage par le radiateur : la température se stabilise.';
      };
      const lp = loop(el, (dt) => {
        const k = 0.08 * (fan ? 1.6 : 1), sim = dt * 2.2;
        T += (4 - k * open() * (T - 20) - 0.004 * (T - 20)) * sim;

        draw();
      }, true);
      const restart = () => { T = 20; fan = false; lp.play(); draw(); };
      q('[data-k="cold"]').addEventListener('click', restart);
      stuck.addEventListener('change', restart);
      if (reduced()) { T = 95; draw(); }
    }
  };

/* Moteurs génériques de schémas interactifs (procédure animée, exploration, tri, remise en ordre, checklist).

window.VizKit = (function () {

  function steps(c) {

        const cl = [...sv.querySelectorAll('[data-c]')].map((e) => [e, e.dataset.c.split('|').map((p) => { const k = p.indexOf(':'); return [rset(p.slice(0, k)), p.slice(k + 1)]; })]);

        const modes = c.challenge ? U.seg('Mode', [['x', 'Explorer'], ['c', c.challenge.label || 'Défi']]) : '';
        return H.head(c.title, modes) + (c.top || '') + svg(c.w, c.h, c.art + pins, c.title, c.h > c.w ? 'xsvg tall' : 'xsvg') +
          `<div class="xpanel" data-panel aria-live="polite"></div><div class="xchips">${c.spots.map((p, i) => `<button type="button" class="xchip" data-i="${i}"><b>${i + 1}</b>${p.t}</button>`).join('')}</div>` + (c.note ? H.note(c.note) : '');
      },
      init(el) {
        const pins = [...el.querySelectorAll('.pin')], chips = el.querySelector('.xchips'), panel = el.querySelector('[data-panel]');
        let mode = 'x', order = [], step = 0, tries = 0, first = 0, picks = new Set(), done = false;
        const clear = () => pins.forEach((p) => p.classList.remove('sel', 'good', 'bad', 'pick', 'miss'));
        const tag = (p) => p.ok === true ? '<span class="xtag ok">Oui</span>' : p.ok === false ? '<span class="xtag no">Non</span>' : '';
        const showX = (i) => { clear(); pins[i].classList.add('sel', 'seen'); const p = c.spots[i]; panel.innerHTML = `<b>${i + 1}. ${p.t}</b> ${tag(p)}${p.d ? `<div>${p.d}</div>` : ''}`; };
        const intro = () => { panel.innerHTML = c.intro || 'Touche un repère numéroté pour l’explorer.'; };
        const askFind = () => {
          if (step >= order.length) { panel.innerHTML = `<b>Terminé : ${first}/${order.length} du premier coup.</b> <button class="vbtn" type="button" data-k="again">Rejouer</button>`; return; }
          const p = c.spots[order[step]]; tries = 0;
          panel.innerHTML = `<span class="mono tnum muted">${step + 1}/${order.length}</span> ${p.q || `Où se trouve : <b>${p.t}</b> ?`}`;
        };
        const askPick = () => { picks = new Set(); done = false; clear(); panel.innerHTML = `${c.challenge.q} <button class="vbtn" type="button" data-k="valid">Valider</button>`; };
        const start = () => {
          clear(); step = 0; first = 0;
          chips.hidden = mode === 'c';
          if (mode === 'x') { intro(); return; }
          if (c.challenge.type === 'pick') askPick();
          else { order = shuffle(c.spots.map((p, i) => i).filter((i) => c.spots[i].q || !c.challenge.qOnly)); askFind(); }
        };
        const hit = (i) => {
          if (mode === 'x') { showX(i); return; }
          if (c.challenge.type === 'pick') {
            if (done) return;
            if (picks.has(i)) { picks.delete(i); pins[i].classList.remove('pick'); } else { picks.add(i); pins[i].classList.add('pick'); }
            return;
          }
          if (step >= order.length) return;
          const want = order[step];
          if (i === want) {
            if (!tries) first++;
            pins[i].classList.add('good'); pop(pins[i]);
            const p = c.spots[i];
            panel.innerHTML = `<b class="good">✓ ${i + 1}. ${p.t}</b>${p.d ? `<div>${p.d}</div>` : ''} <button class="vbtn" type="button" data-k="nextq">${step + 1 < order.length ? 'Suivant ›' : 'Résultat'}</button>`;
          } else {
            tries++; pins[i].classList.add('bad'); shake(pins[i]); setTimeout(() => pins[i].classList.remove('bad'), 700);
          }
        };
        const validate = () => {
          done = true; let ok = 0, wrong = [];
          c.spots.forEach((p, i) => {
            const pk = picks.has(i);
            if (pk && p.ok) { pins[i].classList.add('good'); ok++; }
            else if (pk && !p.ok) { pins[i].classList.add('bad'); wrong.push(i); }
            else if (!pk && p.ok) { pins[i].classList.add('miss'); wrong.push(i); }
          });
          const total = c.spots.filter((p) => p.ok).length;
          panel.innerHTML = `<b class="${wrong.length ? 'warn' : 'good'}">${wrong.length ? `${ok}/${total} trouvés, ${wrong.length} erreur(s).` : `Parfait : les ${total} sont trouvés.`}</b>` +
            (wrong.length ? `<ul class="xlist">${wrong.map((i) => `<li><b>${i + 1}. ${c.spots[i].t}</b> ${tag(c.spots[i])} ${c.spots[i].d || ''}</li>`).join('')}</ul>` : '') + ' <button class="vbtn" type="button" data-k="again">Rejouer</button>';
        };
        el.addEventListener('click', (e) => {
          const pin = e.target.closest('[data-i]'); if (pin) { hit(+pin.dataset.i); return; }
          const b = e.target.closest('[data-k]'); if (!b) return;
          if (b.dataset.k === 'nextq') { step++; askFind(); } else if (b.dataset.k === 'again') start(); else if (b.dataset.k === 'valid') validate();
        });
        el.addEventListener('keydown', (e) => { const pin = e.target.closest('.pin'); if (pin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hit(+pin.dataset.i); } });
        U.bindSeg(el, (m) => { mode = m; start(); });
        if (c.init) c.init(el);
        start();
      }
    };
  }

  /* ---------- Tri : chaque carte va dans la bonne catégorie ---------- */
  function sort(c) {
    return {
      title: c.title,
      html() {
        return H.head(c.title, `<span class="mono tnum muted" data-sc></span>`) + `<p class="viz-desc" style="min-height:0">${c.q}</p>` +

          `<div class="sort-bins">${c.bins.map((b) => `<button type="button" class="sbin" data-b="${b.k}"><span>${b.t}</span><span class="ct" data-ct="${b.k}">0</span></button>`).join('')}</div>` +
          `<div class="sort-fb" data-fb aria-live="polite"></div>` + (c.note ? H.note(c.note) : '');
      },
      init(el) {
        const card = el.querySelector('[data-card]'), fb = el.querySelector('[data-fb]');
        let deck = [], i = 0, good = 0, wait = false, log = [];
        const label = (k) => (c.bins.find((b) => b.k === k) || {}).t || k;
        const show = () => {
          el.querySelector('[data-pg]').style.width = (i / deck.length) * 100 + '%';
          el.querySelector('[data-sc]').textContent = `${good}/${deck.length}`;
          if (i >= deck.length) {
            card.className = 'sort-card end'; card.innerHTML = `<div><b>${good}/${deck.length} bonnes réponses</b>${good === deck.length ? '<br>Sans faute.' : ''}</div>`;
            fb.innerHTML = `<ul class="xlist">${log.map((l) => `<li class="${l.ok ? 'good' : 'bad'}">${l.ok ? '✓' : '✗'} ${l.it.svg ? '' : l.it.t} → <b>${label(l.it.k)}</b>${l.it.why ? ' · ' + l.it.why : ''}</li>`).join('')}</ul><button class="vbtn" type="button" data-k="again">Recommencer</button>`;
            el.querySelectorAll('.sbin').forEach((b) => { b.disabled = true; });
