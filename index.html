          }
          const it = deck[i]; wait = false;
          card.className = 'sort-card'; card.innerHTML = it.svg ? `${it.svg}${it.t ? `<span>${it.t}</span>` : ''}` : `<span>${it.t}</span>`;
          fb.innerHTML = ''; el.querySelectorAll('.sbin').forEach((b) => { b.disabled = false; b.classList.remove('right', 'wrong'); });
          anim(card, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.22,1,.36,1)' });
        };
        const start = () => { deck = shuffle(c.items); i = 0; good = 0; log = []; c.bins.forEach((b) => { el.querySelector(`[data-ct="${b.k}"]`).textContent = '0'; }); show(); };
        el.addEventListener('click', (e) => {
          const k = e.target.closest('[data-k]'); if (k) { if (k.dataset.k === 'again') start(); else if (k.dataset.k === 'nx') { i++; show(); } return; }
          const b = e.target.closest('.sbin'); if (!b || wait || i >= deck.length) return;
          wait = true; const it = deck[i], ok = b.dataset.b === it.k; if (ok) good++;
          log.push({ it, ok });
          const ct = el.querySelector(`[data-ct="${it.k}"]`); ct.textContent = +ct.textContent + 1;
          card.classList.add(ok ? 'good' : 'bad'); (ok ? pop : shake)(card);
          b.classList.add(ok ? 'right' : 'wrong'); if (!ok) el.querySelector(`.sbin[data-b="${it.k}"]`).classList.add('right');
          el.querySelectorAll('.sbin').forEach((x) => { x.disabled = true; });
          fb.innerHTML = `<b class="${ok ? 'good' : 'bad'}">${ok ? '✓ Exact.' : '✗ C’était : ' + label(it.k) + '.'}</b> ${it.why || ''} <button class="vbtn" type="button" data-k="nx">${i + 1 < deck.length ? 'Suivante ›' : 'Résultat'}</button>`;

  /* ---------- Remise en ordre d'une procédure ---------- */
  function order(c) {
    return {
      title: c.title,
      html() {
        return H.head(c.title, '') + `<p class="viz-desc" style="min-height:0">${c.q || 'Touche les étapes dans le bon ordre. Touche une étape placée pour la retirer.'}</p>` +

      },
      init(el) {
        const seq = el.querySelector('[data-seq]'), pool = el.querySelector('[data-pool]'), fb = el.querySelector('[data-fb]');
        let placed = [], rest = [];
        const draw = () => {
          seq.innerHTML = placed.length ? placed.map((i) => `<li data-o="${i}" tabindex="0" role="button">${c.items[i]}</li>`).join('') : '<li class="ord-empty">Ta séquence apparaît ici.</li>';

          el.querySelector('[data-k="check"]').disabled = rest.length > 0;
        };

          const o = e.target.closest('[data-o]'); if (o) { const i = +o.dataset.o; placed = placed.filter((x) => x !== i); rest.push(i); fb.innerHTML = ''; draw(); return; }

        start();
      }
    };
  }

  function check(c) {

      title: c.title,
      html() {

  /* Trajet fermé lissé autour de poulies ou pignons (courroie, chaîne). P = [{x, y, r, back}], C = centre de la boucle. */
  function loopPath(P, C, gap) {
    const pts = [];
    P.forEach((p) => { const a0 = Math.atan2(p.y - C.y, p.x - C.x), dir = p.back ? a0 + Math.PI : a0, rr = p.r + (gap == null ? 3 : gap); (p.back ? [0] : [-0.7, 0, 0.7]).forEach((da) => pts.push([p.x + rr * Math.cos(dir + da), p.y + rr * Math.sin(dir + da)])); });
    let d = '';
    for (let i = 0; i < pts.length; i++) {
      const p0 = pts[(i - 1 + pts.length) % pts.length], p1 = pts[i], p2 = pts[(i + 1) % pts.length], p3 = pts[(i + 2) % pts.length];
      if (!i) d += `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
      d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }

  }
  /* Petit oscillogramme qui défile : renvoie la chaîne des points d'une polyline. */
  function trace(fn, t0, n, x0, w, y0, h) { let s = ''; for (let i = 0; i <= n; i++) { const t = t0 + i / n, v = fn(t); s += `${(x0 + (i / n) * w).toFixed(1)},${(y0 + h - v * h).toFixed(1)} `; } return s; }
  return { steps, explore, sort, order, check, U, A, esc, strip, shuffle, svg, pop, shake, anim, S, loopPath, trace };
})();

  D('quatre-conditions', {

        ${U.desc()}

        ${H.note('Un moteur à essence a besoin d’air dosé, de carburant, d’une étincelle au bon moment et de compression, synchronisés. λ = 1 ≈ 14,7 kg d’air pour 1 kg d’essence ' + S('gen') + '.')}`;
    },
    init(el) {
      const q = U.q(el), on = (k) => q(`[data-c="${k}"]`).checked, btn = q('[data-k="crank"]');
      let th = 0, st = 'off', t0 = 0, lp = null;
      const pis = q('[data-pis]'), rod = q('[data-rod]'), pin = q('[data-pin]'), gas = q('[data-gas]'), sp = q('[data-sp]'), nd = q('[data-nd]');
      const lam = () => +q('#lam').value;
      const runs = () => on('air') && on('fuel') && on('spark') && on('comp') && on('crk');
      const why = () => {
        if (!on('crk')) return 'Compte-tours à zéro pendant que le démarreur tourne : sans signal du capteur de vilebrequin, le calculateur ne commande ni injection ni allumage.';
        if (!on('air')) return 'Pas d’air : papillon bloqué ou filtre bouché (rare). À vérifier : inspection, données du débitmètre.';
        if (!on('fuel')) return 'Pas de carburant : pompe, relais, fusible, filtre, réservoir vide. Écoute la pompe au contact, mesure la pression d’essence.';
        if (!on('spark')) return 'Pas d’étincelle : bobine, bougies, capteur de vilebrequin, calculateur. Testeur d’étincelle, régime au démarreur.';
        if (!on('comp')) return 'Pas de compression : distribution sautée, soupape brûlée, joint de culasse. Test de compression.';
        return '';
      };
      const draw = () => {
        const a = (th * Math.PI) / 180, r = 20, l = 110, sx = r * Math.sin(a), cc = r * Math.cos(a);
        const py = 232 - (cc + Math.sqrt(l * l - sx * sx)), top = py - 14;
        pis.setAttribute('transform', `translate(0 ${top.toFixed(1)})`);
        rod.setAttribute('y1', py.toFixed(1)); rod.setAttribute('x2', (150 + sx).toFixed(1)); rod.setAttribute('y2', (232 - cc).toFixed(1));
        pin.setAttribute('cx', (150 + sx).toFixed(1)); pin.setAttribute('cy', (232 - cc).toFixed(1));
        gas.setAttribute('height', Math.max(0, top - 88).toFixed(1));
        const ph = Math.floor((th % 720) / 180), burning = st === 'run' && ph === 2;
        gas.setAttribute('class', 'gas ' + (burning ? 'g-burn' : ph === 0 ? 'g-in' : ph === 1 ? 'g-comp' : 'g-ex'));
        const fire = (st === 'run' || (st === 'crank' && on('crk') && on('spark'))) && th % 720 > 345 && th % 720 < 380;
        sp.style.opacity = fire ? 1 : 0;
        const rpm = st === 'run' ? 0.25 : st === 'crank' && on('crk') ? 0.08 : 0;
        nd.setAttribute('transform', `rotate(${(-120 + rpm * 240 + (st === 'run' ? Math.sin(th / 40) * 2 : 0)).toFixed(1)} 332 200)`);
        el.querySelectorAll('[data-f]').forEach((f) => f.classList.toggle('off', !(st !== 'off' && on(f.dataset.f) && (f.dataset.f === 'air' || on('crk')))));
        const L = lam();
        el.querySelectorAll('.smoke').forEach((c, i) => { c.style.opacity = st === 'run' ? (L < 0.92 ? 0.75 : 0.18) * (1 - i * 0.2) : 0; c.style.fill = L < 0.92 ? 'var(--ink)' : 'var(--muted)'; });
      };
      const desc = () => {
        const d = q('[data-desc]');
        btn.textContent = st === 'run' ? 'Couper le moteur' : 'Actionner le démarreur';
        if (st === 'crank') d.textContent = 'Le démarreur entraîne le moteur…';
        else if (st === 'run') d.innerHTML = '<b class="good">Le moteur tourne.</b> Coupe une condition pour voir ce qui se passe.';
        else d.innerHTML = runs() ? 'Actionne le démarreur.' : `<b class="bad">Le moteur ne démarre pas.</b> ${why()}`;
      };
      lp = H.loop(el, (dt) => {
        if (st === 'crank') { th += 220 * dt; if (performance.now() - t0 > 2200) { st = runs() ? 'run' : 'off'; desc(); } }
        else if (st === 'run') th += 900 * dt;
        draw();
        if (st === 'off' && lp) lp.pause();
      }, false);
      btn.addEventListener('click', () => { if (st === 'run') { st = 'off'; draw(); desc(); return; } st = 'crank'; t0 = performance.now(); desc(); lp.play(); });
      el.querySelectorAll('[data-c]').forEach((c) => c.addEventListener('change', () => { if (st === 'run' && !runs()) st = 'off'; draw(); desc(); }));
      q('#lam').addEventListener('input', () => {
        const L = lam(); q('[data-out="lam"]').textContent = fx(L, 2);
        U.set(el, 'afr', fx(14.7 * L, 1) + ' kg');
        U.set(el, 'mx', L < 0.97 ? 'Riche' : L > 1.03 ? 'Pauvre' : 'Idéal', L < 0.97 || L > 1.03 ? 'warn' : 'good');
        const d = q('[data-desc]');
        if (L < 0.97) d.innerHTML = '<b>λ &lt; 1, mélange riche :</b> fumée noire, odeur d’essence, bougies noires, consommation élevée.';
        else if (L > 1.03) d.innerHTML = '<b>λ &gt; 1, mélange pauvre :</b> ralenti instable, trous à l’accélération, risque de cliquetis et de surchauffe des soupapes.';
        else desc();
        draw();
      });
      q('[data-out="lam"]').textContent = '1,00'; U.set(el, 'afr', '14,7 kg'); U.set(el, 'mx', 'Idéal', 'good');
      draw(); desc();

    },
    init(el) {
      const q = U.q(el), x = q('#te-x'); let mode = 'ok', m = 15;
      const temp = (t) => {
        const ext = +x.value;
        if (mode === 'ok') return Math.min(ext + (90 - ext) * (1 - Math.exp(-t / 3.2)) + (t > 6 ? Math.sin(t * 1.7) * 1.5 : 0), 92);
        if (mode === 'open') { const pl = 60 + ext * 0.4; return ext + (pl - ext) * (1 - Math.exp(-t / 5)); }
        return Math.min(ext + (125 - ext) * (1 - Math.exp(-t / 4)), 125);
      };
      const Yv = (v) => 150 - (clamp(v, 40, 125) - 40) * 1.8;
      const draw = () => {

      };
      let run = false;
      const lp = H.loop(el, (dt) => { if (run) { m = Math.min(15, m + dt * 2.5); if (m >= 15) run = false; draw(); } }, true);

    }

const CFG = window.ACADEMIE_SUPABASE || null;
const AUTH = { mode: 'login', msg: '', err: '', busy: false };
function stripLocal(o) { const c = JSON.parse(JSON.stringify(o)); delete c.last; delete c.owner; delete c.dirty; c.v = 1; c.xp = xp(); return c; }
function hasProgress() { return Object.keys(S.done).some((k) => S.done[k]) || Object.keys(S.plan).length > 0 || S.log.some((x) => !x.ex) || Object.keys(S.tools).some((k) => S.tools[k]); }
function mergeRemote(R) {
  if (!R || R.v !== 1) return false;
  const before = JSON.stringify(stripLocal(S));
  const rU = R.updated || 0, lU = S.updated || 0;
  if (!S.dirty) {
    if (rU >= lU) { const keep = { last: S.last, owner: S.owner }; S = Object.assign(fresh(), JSON.parse(JSON.stringify(R)), keep); delete S.v; delete S.xp; S.dirty = false; }
    return JSON.stringify(stripLocal(S)) !== before;
  }
  const remoteNewer = rU > lU;
  const del = Object.assign({}, R.deleted || {}, S.deleted || {});
  const rR = R.resetAt || 0, rL = S.resetAt || 0;
  if (rR > lU && rR > rL) { S.done = Object.assign({}, R.done); S.quiz = Object.assign({}, R.quiz); }
  else if (!(rL > rU)) {
    Object.keys(R.done || {}).forEach((k) => { if (R.done[k]) S.done[k] = true; });
    Object.keys(R.quiz || {}).forEach((k) => { S.quiz[k] = Math.max(S.quiz[k] || 0, R.quiz[k] || 0); });
  }
  const list = (loc, rem) => {
    const win = remoteNewer ? rem || [] : loc || [], lose = remoteNewer ? loc || [] : rem || [];
    const ids = new Set(win.map((x) => x.id));
    return win.concat(lose.filter((x) => !ids.has(x.id))).filter((x) => x && !del[x.id]);
  };
  S.log = list(S.log, R.log); S.dossiers = list(S.dossiers, R.dossiers);
  const plan = Object.assign({}, S.plan);
  Object.keys(R.plan || {}).forEach((k) => {
    const a = plan[k] || {}, b = R.plan[k] || {};
    plan[k] = { km: String(Math.max(+a.km || 0, +b.km || 0) || ''), date: [a.date || '', b.date || ''].sort().pop() };
  });
  S.plan = plan;
  if (remoteNewer) { S.car = Object.assign({}, S.car, R.car); S.tools = Object.assign({}, R.tools); S.cards = Object.assign({}, R.cards); S.checks = Object.assign({}, R.checks); }
  S.deleted = del; S.resetAt = Math.max(rL, rR); S.updated = Math.max(lU, rU);
  return JSON.stringify(stripLocal(S)) !== before;
}
function authErr(e) {
  const m = String((e && (e.message || e.error_description || e.msg)) || e || ''); const c = (e && e.code) || '';
  if (/invalid login credentials/i.test(m) || c === 'invalid_credentials') return 'Identifiant ou mot de passe incorrect.';
  if (/email not confirmed/i.test(m) || c === 'email_not_confirmed') return 'Adresse pas encore confirmée : clique sur le lien reçu par e-mail, puis reconnecte-toi.';
  if (/already registered|already been registered/i.test(m) || c === 'user_already_exists') return 'Un compte existe déjà avec cette adresse e-mail.';
  if (/rate limit|too many/i.test(m) || /rate_limit/.test(c)) return 'Trop de tentatives ou d’e-mails envoyés. Réessaie dans quelques minutes.';
  if (/weak|at least|should be/i.test(m) && /password/i.test(m)) return 'Mot de passe trop faible : 8 caractères minimum.';
  if (/invalid.*email|email.*invalid|unable to validate email/i.test(m)) return 'Adresse e-mail invalide.';
  if (/database error saving new user/i.test(m)) return 'Inscription refusée par le serveur (nom d’utilisateur déjà pris ?).';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Serveur injoignable : vérifie ta connexion Internet.';
  if (/same.*password|different from the old/i.test(m)) return 'Le nouveau mot de passe doit être différent de l’ancien.';
  return m || 'Une erreur est survenue.';
}
const Cloud = { sb: null, user: null, profile: null, on: false, ready: false, timer: null, writing: false, again: false, lastSync: 0, offline: false,
  available() { return !!(CFG && CFG.url && CFG.key && window.supabase && window.supabase.createClient); },
  name() { return (this.profile && this.profile.username) || (this.user && ((this.user.user_metadata || {}).username || this.user.email)) || ''; },
  async init() {
    if (!this.available()) { this.ready = true; return; }
    try {
      this.sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'academie-auth' } });
      this.sb.auth.onAuthStateChange((ev, session) => {
        if (ev === 'PASSWORD_RECOVERY') { AUTH.mode = 'newpass'; AUTH.msg = 'Choisis ton nouveau mot de passe.'; AUTH.err = ''; setTimeout(() => { location.hash = 'compte'; }, 0); }
        const u = session ? session.user : null; const was = this.user && this.user.id; this.user = u;
        if (u && u.id !== was) setTimeout(() => this.onLogin(), 0);
        else if (!u && was) setTimeout(() => this.onLogout(), 0);
      });
      await this.sb.auth.getSession();
    } catch (e) { this.offline = true; }
    this.ready = true; chrome(); if (curHash() === 'compte') rerender();
  },
  async onLogin() {
    const uid = this.user && this.user.id; if (!uid) return;
    try {
      const [p, g] = await Promise.all([
        this.sb.from('profiles').select('username').eq('id', uid).maybeSingle(),
        this.sb.from('w203_progress').select('state').eq('user_id', uid).maybeSingle()]);
      if (g.error) throw g.error;
      this.profile = p.data || null;
      if (S.owner && S.owner !== uid) S = fresh();
      const guest = !S.owner && hasProgress();
      if (guest) S.dirty = true; else if (!S.owner) S.dirty = false;
      if (g.data && g.data.state) mergeRemote(g.data.state); else S.dirty = true;
      S.owner = uid; store(); this.on = true; this.offline = false;
      await this.flush();
      if (guest && g.data && g.data.state) toast('Ta progression locale a été ajoutée à ton compte.');
    } catch (e) { this.offline = true; }
    chrome(); softRender();
  },
  onLogout() {
    this.on = false; this.profile = null; S = fresh(); store(); AUTH.mode = 'login'; chrome(); softRender();
  },
  async pull() {
    if (!this.on || !this.user) return;
    try {
      const g = await this.sb.from('w203_progress').select('state').eq('user_id', this.user.id).maybeSingle();
      if (g.error) throw g.error;
      if (g.data && g.data.state && mergeRemote(g.data.state)) { store(); softRender(); }
      if (S.dirty) this.push(true);
      this.offline = false;
    } catch (e) { this.offline = true; }
    chrome();
  },
  push(now) { if (!this.on) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), now ? 50 : 1500); },
  async flush() {
    if (!this.on || !this.user) return;
    if (this.writing) { this.again = true; return; }
    this.writing = true;
    try {
      const r = await this.sb.from('w203_progress').upsert({ user_id: this.user.id, state: stripLocal(S) }, { onConflict: 'user_id' });
      if (r.error) throw r.error;
      S.dirty = false; store(); this.lastSync = Date.now(); this.offline = false;
    } catch (e) { this.offline = true; }
    this.writing = false; chrome();
    if (this.again) { this.again = false; this.flush(); }
  }
};

}
function rank(x) {

  RANKS.forEach((r, i) => { if (x >= r[0]) { cur = r; next = RANKS[i + 1] || null; } });

}

let CARD = null;
function cardDeck() {

    <div class="fc-face fc-front"><small class="eyebrow">Terme</small><b>${g[0]}</b><i>${g[1]}</i><span class="fc-hint">Touche la carte pour voir la définition</span></div>

function cardAnswer(yes) {
  const k = CARD.queue[CARD.i]; S.cards[k] = yes ? Math.min(3, (S.cards[k] || 0) + 1) : 0; save();
  const next = () => { CARD.i++; CARD.flipped = false; CARD.fresh = true; if (CARD.i >= CARD.queue.length) { cardDeck(); toast('Paquet terminé : on recommence par les cartes à revoir'); } rerender(true); };
  const fc = $('#fc');
  if (fc && fc.animate && !Motion.reduced()) fc.animate([{ transform: fc.style.transform || 'none', opacity: 1 }, { transform: `translateX(${yes ? 130 : -130}%) rotate(${yes ? 14 : -14}deg)`, opacity: 0 }], { duration: 280, easing: 'ease-in' }).onfinish = next;
  else next();
}
function bindCard() {
  const fc = $('#fc'); if (!fc) return;
  CARD.fresh = false;
  let x0 = null, dx = 0, moved = false;
  fc.addEventListener('pointerdown', (e) => { x0 = e.clientX; dx = 0; moved = false; fc.setPointerCapture(e.pointerId); fc.classList.add('drag'); });
  fc.addEventListener('pointermove', (e) => { if (x0 == null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true; if (moved) fc.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; fc.dataset.swipe = dx > 40 ? 'yes' : dx < -40 ? 'no' : ''; });
  const end = () => { if (x0 == null) return; x0 = null; fc.classList.remove('drag'); fc.dataset.swipe = ''; if (Math.abs(dx) > 90) cardAnswer(dx > 0); else fc.style.transform = ''; };
  fc.addEventListener('pointerup', end); fc.addEventListener('pointercancel', end);
  fc.addEventListener('click', () => { if (moved) return; CARD.flipped = !CARD.flipped; fc.classList.toggle('flip', CARD.flipped); });
  fc.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fc.click(); } else if (e.key === 'ArrowRight') cardAnswer(true); else if (e.key === 'ArrowLeft') cardAnswer(false); });
}

function newRevision() {

function showDate(d) {

  const t = new Date(d); return isNaN(t) ? d : t.toLocaleDateString('fr-FR');
}
function due(p) {
  const st = S.plan[p.id] || {}; const cur = +S.car.km || 0; const parts = []; let cls = 'ok', any = false;
  if (p.km && st.km) {
    any = true; const left = (+st.km + p.km) - cur;
    if (left <= 0) { cls = 'late'; parts.push('dépassé de ' + fmt(-left) + ' km'); } else { parts.push('dans ' + fmt(left) + ' km'); if (left < p.km * 0.1) cls = 'soon'; }
  }

      if (days <= 0) { cls = 'late'; parts.push('en retard de ' + fmt(-days) + ' j'); } else { parts.push('dans ' + fmt(days) + ' j'); if (days < 45 && cls !== 'late') cls = 'soon'; }
    }
  }

function convert(from) {

  if (isNaN(nmv)) return;

  if (from !== 'lbf') lbEl.value = +(nmv * 0.737562).toFixed(1);

    updateXp(); renderRail(decodeURIComponent((location.hash || '').slice(1)));
  } else if (act === 'done') {
    const id = b.dataset.l, x0 = xp(), r0 = rank(x0).name, mod = LMAP[id].mod, was = modProg(mod)[0] === mod.lessons.length;
    S.done[id] = !S.done[id]; save();
    b.classList.toggle('done', !!S.done[id]); b.textContent = S.done[id] ? 'Leçon terminée ✓' : 'Marquer comme terminée';
    if (S.done[id]) { Motion.pop(b); celebrate(b, x0, r0, mod, was); }
    updateXp(); renderRail(decodeURIComponent((location.hash || '').slice(1)));
  } else if (act === 'tnext') {
    const t = TMAP[TREE.id], node = t.n[TREE.path[TREE.path.length - 1]], a = node.a[+b.dataset.i];
    TREE.picks.push(a[0]); TREE.path.push(a[1]); view.innerHTML = vTree(t); window.scrollTo(0, 0); Motion.stepIn($('#tree-card'), 'fwd');
  } else if (act === 'tback') {
    TREE.path.pop(); TREE.picks.pop(); view.innerHTML = vTree(TMAP[TREE.id]); Motion.stepIn($('#tree-card'), 'back');
  } else if (act === 'treset') {
    const t = TMAP[TREE.id]; TREE = null; view.innerHTML = vTree(t); window.scrollTo(0, 0);
  } else if (act === 'vz-open') {
    VZ_CUR = b.dataset.v; const box = $('#vz-view');
    if (box) { box.innerHTML = vzView(VZ_CUR); Viz.mount(box); box.scrollIntoView({ behavior: Motion.reduced() ? 'auto' : 'smooth', block: 'start' }); }
    view.querySelectorAll('.vz-item').forEach((x) => x.classList.toggle('on', x.dataset.v === VZ_CUR));
  } else if (act === 'fc-flip') {
    const fc = $('#fc'); if (fc) fc.click();
  } else if (act === 'fc-yes' || act === 'fc-no') {
    cardAnswer(act === 'fc-yes');
  } else if (act === 'rev-new') {
    newRevision(); rerender();
  } else if (act === 'log-add') {
    const what = $('#lg-what').value.trim();
    if (!what) { toast('Indique l’intervention avant d’ajouter.'); $('#lg-what').focus(); return; }
    S.log.push({ id: 'x' + Date.now(), date: $('#lg-date').value || new Date().toISOString().slice(0, 10), km: $('#lg-km').value, what, notes: $('#lg-notes').value.trim() });
    save(); $('#lg-what').value = ''; $('#lg-notes').value = ''; $('#log-list').innerHTML = logRows(); toast('Ajouté au carnet');
  } else if (act === 'log-del') {
    S.log = S.log.filter((x) => x.id !== b.dataset.id); S.deleted[b.dataset.id] = Date.now(); save(); $('#log-list').innerHTML = logRows(); toast('Entrée supprimée');
  } else if (act === 'copy-log') {
    const txt = logText();
    const fallback = () => { const ta = $('#copy-fallback'); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast('Texte sélectionné : copie-le manuellement'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Carnet copié'), fallback); } catch (err) { fallback(); }
  } else if (act === 'dos-add') {
    S.dossiers.push({ id: 'd' + Date.now(), title: 'Nouveau dossier', status: 'afaire', lesson: '', notes: '' }); save(); rerender();
  } else if (act === 'dos-del') {
    S.dossiers = S.dossiers.filter((d) => d.id !== b.dataset.id); S.deleted[b.dataset.id] = Date.now(); save(); rerender(); toast('Dossier supprimé');
  } else if (act === 'acct-mode') {
    AUTH.mode = b.dataset.m; AUTH.err = ''; AUTH.msg = ''; rerender();
  } else if (act === 'acct-pwd') {
    AUTH.mode = 'newpass'; AUTH.err = ''; AUTH.msg = ''; rerender();
  } else if (act === 'acct-sync') {
    b.disabled = true; Cloud.pull().then(() => Cloud.flush()).then(() => { toast(Cloud.offline ? 'Serveur injoignable' : 'Synchronisé'); rerender(); });
  } else if (act === 'acct-logout') {
    b.disabled = true; Promise.resolve(Cloud.flush()).then(() => Cloud.sb.auth.signOut()).then(() => toast('Déconnecté')).catch(() => toast('Déconnexion impossible'));
  } else if (act === 'reset-progress') {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirmer la remise à zéro'; b.classList.remove('ghost'); return; }
    S.done = {}; S.quiz = {}; S.last = ''; S.resetAt = Date.now(); Object.keys(QS).forEach((k) => delete QS[k]); save(); rerender(); toast('Progression remise à zéro');
  }
});

view.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'code-q') $('#code-list').innerHTML = codeRows(el.value);
  else if (el.id === 'gl-q') $('#gl-list').innerHTML = glossRows(el.value);
  else if (el.id === 'vz-q') { const q = norm(el.value); view.querySelectorAll('.vz-g').forEach((g) => { let any = false; g.querySelectorAll('.vz-item').forEach((x) => { const ok = !q || norm(x.textContent).indexOf(q) >= 0; x.hidden = !ok; if (ok) any = true; }); g.hidden = !any; }); }
  else if (el.id === 'tq-q') $('#tq-body').innerHTML = torqueRows($('#tq-sys').value, el.value);
  else if (el.id === 'cv-nm') convert('nm'); else if (el.id === 'cv-lbf') convert('lbf'); else if (el.id === 'cv-kgf') convert('kgf');
  else if (el.id === 'cf-t' || el.id === 'cf-l' || el.id === 'cf-e') calcCrowfoot();
  else if (el.dataset.car) { S.car[el.dataset.car] = el.dataset.car === 'km' ? (el.value === '' ? '' : +el.value) : el.value; save(); if (el.dataset.car === 'km') R.plan.forEach(paintDue); }
  else if (el.dataset.dosTitle) { const d = S.dossiers.find((x) => x.id === el.dataset.dosTitle); if (d) { d.title = el.value; save(); } }
  else if (el.dataset.dosNotes) { const d = S.dossiers.find((x) => x.id === el.dataset.dosNotes); if (d) { d.notes = el.value; save(); } }
  else if (el.dataset.planKm || el.dataset.planDate) {
    const id = el.dataset.planKm || el.dataset.planDate; const st = S.plan[id] || (S.plan[id] = {});
    if (el.dataset.planKm) st.km = el.value; else st.date = el.value; save();
    paintDue(R.plan.find((x) => x.id === id));
  }
});
view.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'tq-sys') $('#tq-body').innerHTML = torqueRows(el.value, $('#tq-q').value);
  else if (el.dataset.dosStatus) { const d = S.dossiers.find((x) => x.id === el.dataset.dosStatus); if (d) { d.status = el.value; save(); toast('Statut : ' + statusLabel(el.value)); } }
  else if (el.dataset.tool) { S.tools[el.dataset.tool] = el.checked; save(); const c = $('#tools-count'); if (c) c.textContent = R.tools.filter((t, i) => S.tools[i]).length + '/' + R.tools.length; }
});

/* ---------- Recherche ---------- */
const IDX = LESSONS.map((l) => ({ l, t: norm(l.title), b: norm(l.body.replace(/<[^>]+>/g, ' ')) }));
function search(q) {
  const toks = norm(q).split(/\s+/).filter((x) => x.length > 1);
  if (!toks.length) return '<p class="muted">Tape au moins deux lettres : bougie, P0171, ATF, biellette…</p>';
  const hit = (txt) => toks.every((t) => txt.includes(t));
  const ls = IDX.map((x) => ({ x, sc: (hit(x.t) ? 10 : 0) + (hit(x.b) ? 1 : 0) })).filter((r) => r.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 10);
  const tq = R.torques.filter((t) => hit(norm(t.part + ' ' + t.sys + ' ' + t.note)));
  const dc = R.dtc.filter((d) => hit(norm(d.join(' '))));
  const gl = R.gloss.filter((g) => hit(norm(g.join(' '))));
  const tr = W.trees.filter((t) => hit(norm(t.title + ' ' + t.desc)));
  let out = '';
  if (ls.length) out += `<div class="res-group"><h4>Leçons</h4>${ls.map((r) => `<a href="#l-${r.x.l.id}">${r.x.l.title}<small>${r.x.l.mod.code} · ${r.x.l.mod.title}</small></a>`).join('')}</div>`;
  if (tr.length) out += `<div class="res-group"><h4>Diagnostic guidé</h4>${tr.map((t) => `<a href="#t-${t.id}">${t.title}<small>${t.desc}</small></a>`).join('')}</div>`;
  if (tq.length) out += `<div class="res-group"><h4>Couples de serrage</h4>${tq.map((t) => `<a href="#ref-couples">${t.part} · <span class="mono">${t.val}</span><small>${t.sys} · source : ${W.SRC[t.src][0]}</small></a>`).join('')}</div>`;
  if (dc.length) out += `<div class="res-group"><h4>Codes défaut</h4>${dc.slice(0, 8).map((d) => `<a href="#codes">${d[0]} · ${d[1]}<small>${d[2]}</small></a>`).join('')}</div>`;
  if (gl.length) out += `<div class="res-group"><h4>Glossaire</h4>${gl.slice(0, 6).map((g) => `<a href="#ref-glossaire">${g[0]}<small>${g[2]}</small></a>`).join('')}</div>`;
  return out || '<p class="muted">Aucun résultat. Essaie un mot plus simple.</p>';
}
const panel = $('#search'), sq = $('#sq'), sr = $('#sr');
function openSearch() { panel.hidden = false; sq.value = ''; sr.innerHTML = search(''); setTimeout(() => sq.focus(), 30); }
function closeSearch() { panel.hidden = true; }
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-open-search]')) { openSearch(); return; }
  if (e.target.closest('[data-close-search]')) { closeSearch(); return; }
  if (!panel.hidden && e.target.closest('#sr a')) closeSearch();
});
sq.addEventListener('input', () => { sr.innerHTML = search(sq.value); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !panel.hidden) closeSearch();
  if (e.key === '/' && panel.hidden && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
});

view.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); if (!Cloud.sb || AUTH.busy) return;
  const kind = f.dataset.form, fd = new FormData(f), v = (k) => String(fd.get(k) || '').trim();
  const btn = f.querySelector('button[type="submit"]'), label = btn ? btn.textContent : '';
  const busy = (x) => { AUTH.busy = x; if (btn) { btn.disabled = x; btn.textContent = x ? 'Patiente…' : label; } };
  const redirect = location.origin + location.pathname;
  acctSay('', ''); busy(true);
  try {
    if (kind === 'login') {
      const id = v('login'), pwd = String(fd.get('password') || '');
      if (!id || !pwd) { acctSay('Renseigne ton e-mail (ou nom d’utilisateur) et ton mot de passe.'); return; }
      let email = id;
      if (!id.includes('@')) {
        const q = await Cloud.sb.rpc('resolve_login', { p_login: id, p_password: pwd });
        if (q.error) { acctSay(authErr(q.error)); return; }
        if (!q.data) { acctSay('Identifiant ou mot de passe incorrect. Après 10 essais, ce nom d’utilisateur est bloqué 15 minutes.'); return; }
        email = q.data;
      }
      const r = await Cloud.sb.auth.signInWithPassword({ email, password: pwd });
      if (r.error) { acctSay(authErr(r.error)); return; }
      AUTH.mode = 'login'; toast('Connecté');
    } else if (kind === 'signup') {
      const u = v('username'), em = v('email'), pw = String(fd.get('password') || '');
      if (!/^[A-Za-z0-9._-]{3,24}$/.test(u)) { acctSay('Nom d’utilisateur : 3 à 24 caractères, lettres sans accent, chiffres, point, tiret ou soulignement.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { acctSay('Adresse e-mail invalide.'); return; }
      if (pw.length < 8) { acctSay('Mot de passe : 8 caractères minimum.'); return; }
      if (pw !== String(fd.get('password2') || '')) { acctSay('Les deux mots de passe ne correspondent pas.'); return; }
      const a = await Cloud.sb.rpc('username_available', { p_username: u });
      if (a.error) { acctSay(authErr(a.error)); return; }
      if (a.data === false) { acctSay('Ce nom d’utilisateur est déjà pris.'); return; }
      const r = await Cloud.sb.auth.signUp({ email: em, password: pw, options: { data: { username: u }, emailRedirectTo: redirect } });
      if (r.error) { acctSay(authErr(r.error)); return; }
      if (r.data && r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0) { acctSay('Un compte existe déjà avec cette adresse e-mail.'); return; }
      if (!r.data.session) { AUTH.mode = 'login'; rerender(); acctSay('', 'Compte créé. Ouvre le lien de confirmation reçu par e-mail, puis connecte-toi ici.'); return; }
      toast('Compte créé. Bienvenue, ' + u + ' !');
    } else if (kind === 'forgot') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))) { acctSay('Adresse e-mail invalide.'); return; }
      const r = await Cloud.sb.auth.resetPasswordForEmail(v('email'), { redirectTo: redirect });
      if (r.error) { acctSay(authErr(r.error)); return; }
      acctSay('', 'Si un compte existe pour cette adresse, un lien vient d’être envoyé. Pense à vérifier les indésirables.');
    } else if (kind === 'newpass') {
      const p1 = String(fd.get('password') || ''), p2 = String(fd.get('password2') || '');
      if (p1.length < 8) { acctSay('Mot de passe : 8 caractères minimum.'); return; }
      if (p1 !== p2) { acctSay('Les deux mots de passe ne correspondent pas.'); return; }
      const r = await Cloud.sb.auth.updateUser({ password: p1 });
      if (r.error) { acctSay(authErr(r.error)); return; }
      AUTH.mode = 'login'; rerender(); acctSay('', 'Mot de passe modifié.');
    }
  } catch (err) { acctSay(authErr(err)); }
  finally { busy(false); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Cloud.pull(); else if (Cloud.on && S.dirty) Cloud.flush(); });

route();
Cloud.init();
